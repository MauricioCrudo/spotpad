<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141519">
<title>SpotPad · Artista</title>
<style>
/* ===== Temas ===== */
:root,[data-theme=estudio]{
  --bg:#141519; --surface:#1b1d22; --raised:#23262d; --press:#2b2f37; --line:#2e323b; --line2:#3a3f4a;
  --text:#edeef0; --dim:#8b909b; --faint:#5d626d; --accent:#f0b03f; --on-accent:#1d1505;
  --ok:#5cc98a; --err:#ef6a5e; --err-text:#ffb4ab; --shadow:none; --scrim:#000b;
}
[data-theme=cabina]{
  --bg:#0e1615; --surface:#132020; --raised:#1a2a29; --press:#213433; --line:#253836; --line2:#30484a;
  --text:#e3efec; --dim:#7c9893; --faint:#56706c; --accent:#5ed6b4; --on-accent:#05211a;
  --ok:#8fdc6e; --err:#f07a6a; --err-text:#ffb8ac; --shadow:none; --scrim:#000b;
}
[data-theme=noche]{
  --bg:#12131c; --surface:#191b27; --raised:#212433; --press:#2a2e40; --line:#2d3043; --line2:#3b3f57;
  --text:#e9eaf4; --dim:#8b8fa8; --faint:#61657d; --accent:#a99bff; --on-accent:#17113a;
  --ok:#6fd4a0; --err:#ff7a8a; --err-text:#ffb6c0; --shadow:none; --scrim:#000b;
}
[data-theme=dia]{
  --bg:#eceef1; --surface:#f8f9fa; --raised:#ffffff; --press:#e6e9ee; --line:#d9dde3; --line2:#c6ccd5;
  --text:#17191e; --dim:#626977; --faint:#9aa1ad; --accent:#b8720a; --on-accent:#ffffff;
  --ok:#1f9a55; --err:#c8372b; --err-text:#b3261e; --shadow:0 1px 2px #1b22300f,0 1px 1px #1b22300a; --scrim:#11151c66;
}
:root{--r:12px; --r-lg:18px; --tab-h:0px; --dock-h:0px; color-scheme:dark}
[data-theme=dia]{color-scheme:light}


*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tc{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}

header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.on{background:var(--ok)} .dot.off{background:var(--err)}
.ses{flex:1;min-width:0;color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;margin-top:10px}
.seg button{flex:1;border:0;background:none;color:var(--dim);font-size:14px;font-weight:600;padding:8px 6px;border-radius:8px}
.seg button.sel{background:var(--raised);color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}

main{padding:14px 16px 0;max-width:760px;margin:0 auto}
/* Lo que se está grabando: lo más grande de la pantalla, para leerlo de lejos */
.now{border-radius:20px;background:var(--surface);border:1px solid var(--line);padding:18px 18px 16px;margin-bottom:14px;
  box-shadow:inset 4px 0 0 var(--accent)}
.now .lbl{font-size:13px;color:var(--accent);font-weight:650}
.now .nm{font-size:clamp(30px,9vw,52px);font-weight:760;line-height:1.05;letter-spacing:-.02em;margin:6px 0 8px;word-break:break-word}
.now .meta{color:var(--dim);font-size:14px}
.now.idle{box-shadow:none}
.now.idle .nm{font-size:22px;color:var(--dim);font-weight:600}
.next{color:var(--dim);font-size:14px;margin:-4px 2px 16px}
.next b{color:var(--text);font-weight:620}

.stats{display:flex;align-items:center;gap:10px;margin:0 2px 10px;font-size:14px;color:var(--dim)}
.stats .bar{flex:1;height:4px;border-radius:3px;background:var(--raised);overflow:hidden}
.stats .bar i{display:block;height:100%;background:var(--ok)}
.tog{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--dim);margin:0 2px 12px}
.tog input{width:20px;height:20px;accent-color:var(--accent)}

.grp{font-size:13px;color:var(--dim);font-weight:600;margin:18px 2px 6px;display:flex;justify-content:space-between}
.it{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:12px 14px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);margin-bottom:6px}
.it .n{font-size:18px;font-weight:650;line-height:1.2;word-break:break-word}
.it .c{grid-column:1;font-size:13px;color:var(--dim)}
.it .t{grid-row:1 / span 2;grid-column:2;text-align:right;font-size:13px;color:var(--dim)}
.it .t small{display:block;color:var(--faint);font-size:12px}
.it.cur{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.it.ok{background:none;border-style:dashed;opacity:.55}
.it.ok .n{text-decoration:line-through;text-decoration-thickness:1.5px;font-weight:550}
.it.ok .n::before{content:"✓ ";color:var(--ok);text-decoration:none;display:inline-block;margin-right:2px}
.ref{display:inline-block;margin-left:8px;font-size:11px;font-weight:750;letter-spacing:.06em;color:var(--on-accent);
  background:var(--accent);border-radius:5px;padding:2px 6px;vertical-align:3px}
.msg{color:var(--dim);padding:28px 4px;text-align:center;line-height:1.5}
.foot{color:var(--faint);font-size:12px;text-align:center;margin:20px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>
(function () {   // mismo tema que eligió este dispositivo en SpotPad
  let t = 'auto'; try { t = JSON.parse(localStorage.getItem('spotpad.theme')) || 'auto'; } catch (e) {}
  const light = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches;
  document.documentElement.dataset.theme = t === 'auto' ? (light ? 'dia' : 'estudio') : t;
})();
</script>
</head>
<body>
<header>
  <div class="top"><span class="dot" id="dot"></span><b>Artista</b><span class="ses tc" id="ses">conectando…</span></div>
  <nav class="seg" id="seg">
    <button data-k="sweep" class="sel">Lo que se graba</button><button data-k="props">Props</button><button data-k="fts">Pasos</button>
  </nav>
</header>
<main>
  <section class="now idle" id="now"><div class="lbl">Ahora</div><div class="nm">Esperando al grabador…</div><div class="meta"></div></section>
  <div class="next" id="next"></div>
  <div class="stats" id="stats"></div>
  <label class="tog"><input type="checkbox" id="hide"> Solo lo pendiente (lo muteado en Pro Tools cuenta como grabado)</label>
  <div id="list"></div>
  <p class="foot" id="foot"></p>
</main>
<script>
const PAGE_VERSION = '__SPOTPAD_VERSION__';
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const store = {get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
               set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }};
let kind = store.get('spotpad.artista.kind', 'sweep'), hide = store.get('spotpad.artista.hide', true), lastSig = '', lastCur = '';
$('#hide').checked = hide;
$('#hide').onchange = e => { hide = e.target.checked; store.set('spotpad.artista.hide', hide); lastSig = ''; load(); };
document.querySelectorAll('#seg button').forEach(b => {
  b.classList.toggle('sel', b.dataset.k === kind);
  b.onclick = () => { kind = b.dataset.k; store.set('spotpad.artista.kind', kind);
    document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('sel', x === b)); lastSig = ''; load(); };
});
const recorded = i => i.done || i.muted;
const short = n => String(n || '').replace(/^(Prps|Fts)\s+/i, '');   // el prefijo es para Pro Tools, no para el artista

function render(d) {
  const items = d.items || [];
  const now = d.now, nb = $('#now');
  if (now) {
    nb.className = 'now';
    nb.innerHTML = `<div class="lbl">Ahora</div><div class="nm">${esc(short(now.name))}${now.ref ? '<span class="ref">REF</span>' : ''}</div>
      <div class="meta"><span class="tc">${esc(now.tc_in)}</span> · ${esc(now.track)}${now.clip && now.clip !== now.track ? ' · clip «' + esc(now.clip) + '»' : ''}</div>`;
  } else {
    nb.className = 'now idle';
    nb.innerHTML = '<div class="lbl">Ahora</div><div class="nm">Esperando al grabador…</div><div class="meta">Cuando vaya a un clip, aparece acá.</div>';
  }
  // Lo que viene: el próximo pendiente después del actual
  const ci = now ? items.findIndex(i => i.key === now.key) : -1;
  const nx = items.slice(ci + 1).find(i => !recorded(i)) || (ci < 0 ? items.find(i => !recorded(i)) : null);
  $('#next').innerHTML = nx ? `Después: <b>${esc(short(nx.name))}</b> <span class="tc">${esc(nx.tc_in)}</span>` : '';
  const pend = items.filter(i => !recorded(i)).length, tot = items.length;
  $('#stats').innerHTML = tot ? `<span>Pendientes <b style="color:var(--text)">${pend}</b> de ${tot}</span><span class="bar"><i style="width:${(tot - pend) / tot * 100}%"></i></span>` : '';
  const box = $('#list');
  if (!tot) { box.innerHTML = `<div class="msg">${kind === 'sweep' ? 'El grabador todavía no eligió qué barrer.' : kind === 'fts' ? 'No hay pasos marcados en el spotting.' : 'No hay props marcados en el spotting.'}</div>`; return; }
  const by = new Map();
  items.forEach(i => { if (!by.has(i.track)) by.set(i.track, []); by.get(i.track).push(i); });
  let html = '';
  for (const [track, its] of by) {
    const show = hide ? its.filter(i => !recorded(i) || i.cur) : its;
    if (!show.length) continue;
    const p = its.filter(i => !recorded(i)).length;
    html += `<div class="grp"><span>${esc(track)}</span><span>${p ? p + ' pendiente' + (p > 1 ? 's' : '') : 'listo'}</span></div>`;
    // Pendientes primero, después lo grabado (atenuado y tachado)
    for (const i of [...show.filter(i => !recorded(i)), ...show.filter(recorded)]) {
      html += `<div class="it${recorded(i) ? ' ok' : ''}${i.cur ? ' cur' : ''}" ${i.cur ? 'id="curItem"' : ''}>
        <div class="n">${esc(short(i.name))}${i.ref ? '<span class="ref">REF</span>' : ''}</div>
        <div class="c">${recorded(i) ? 'grabado' : esc(i.clip)}</div>
        <div class="t tc">${esc(i.tc_in)}<small>${i.secs} s</small></div></div>`;
    }
  }
  box.innerHTML = html || '<div class="msg">Ya está todo grabado.</div>';
  if (now && now.key !== lastCur) {
    lastCur = now.key;
    const el = document.getElementById('curItem');
    if (el && el.getBoundingClientRect().top > window.innerHeight) el.scrollIntoView({block: 'center', behavior: 'smooth'});
  }
}

async function load() {
  try {
    const r = await fetch('/api/artista?kind=' + kind, {cache: 'no-store'});
    const d = await r.json();
    $('#dot').className = 'dot ' + (d.ok ? 'on' : 'off');
    $('#ses').textContent = d.ok ? d.session : (d.error || 'sin datos');
    $('#foot').textContent = d.at ? `Sesión leída a las ${d.at}` : '';
    const sig = JSON.stringify([d.now && d.now.key, (d.items || []).map(i => i.key + i.done + i.muted + i.name)]);
    if (sig !== lastSig) { lastSig = sig; render(d); }
  } catch {
    $('#dot').className = 'dot off'; $('#ses').textContent = 'sin conexión con la computadora';
  }
}
async function checkVersion() {
  try { const s = await (await fetch('/api/health', {cache: 'no-store'})).json();
        if (s.version && s.version !== PAGE_VERSION && !PAGE_VERSION.startsWith('__')) location.reload(); } catch {}
}
load(); setInterval(() => { if (document.visibilityState === 'visible') load(); }, 3000);
setInterval(checkVersion, 30000);
</script>
</body>
</html>
