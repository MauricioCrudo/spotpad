<!doctype html>
<html lang="es">
<head>
<script src="/pair.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpotPad · Carímetro</title>
<style>
/* Hoja para imprimir: siempre clara, A4 vertical */
@page{size:A4 portrait;margin:12mm}
*{box-sizing:border-box}
html,body{margin:0;background:#eceef1;color:#17191e;font:14px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif}
.bar{position:sticky;top:0;display:flex;gap:10px;align-items:center;padding:10px 16px;background:#fff;border-bottom:1px solid #d9dde3}
.bar span{flex:1;color:#626977;font-size:13px}
.bar button,.bar label{font:inherit;font-size:14px;border:1px solid #c6ccd5;background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer}
.bar label{display:flex;gap:6px;align-items:center}
.hoja{width:210mm;min-height:297mm;margin:16px auto;padding:12mm;background:#fff;box-shadow:0 1px 4px #0002}
h1{font-size:22px;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:#626977;font-size:12px;margin-bottom:8mm}
.grid{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:6mm}
.c{break-inside:avoid;border:1px solid #d9dde3;border-radius:3mm;overflow:hidden}
.ph{aspect-ratio:3/4;background:#f1f2f4;display:grid;place-items:center;color:#9aa1ad;font-size:28px;font-weight:700}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.in{padding:2.5mm 3mm 3mm}
.nm{font-size:15px;font-weight:750;line-height:1.15}
.ac{font-size:11px;color:#626977}
.sh{font-size:10.5px;color:#4b515c;margin-top:1mm}
.nt{font-size:10px;color:#626977;margin-top:1mm;font-style:italic}
.msg{color:#626977;padding:20mm 0;text-align:center}
@media print{
  html,body{background:#fff}
  .bar{display:none}
  .hoja{margin:0;padding:0;width:auto;min-height:0;box-shadow:none}
}
</style>
</head>
<body>
<div class="bar">
  <span id="st">Leyendo…</span>
  <label><input type="checkbox" id="todos"> Incluir los que no tienen foto</label>
  <label>Por fila <select id="cols"><option>3</option><option selected>4</option><option>5</option></select></label>
  <button id="pr">Imprimir</button>
</div>
<div class="hoja">
  <h1 id="tit">Carímetro</h1>
  <div class="sub" id="sub"></div>
  <div class="grid" id="grid"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const ini = n => String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
let data = null;
function render() {
  const cols = $('#cols').value; $('#grid').style.setProperty('--cols', cols);
  const ps = (data.personajes || []).filter(p => p.id && (p.cara || $('#todos').checked));
  $('#tit').textContent = data.proyecto ? `Carímetro · ${data.proyecto}` : 'Carímetro';
  $('#sub').textContent = `${ps.length} personajes · ${new Date().toLocaleDateString('es-AR')}`;
  $('#grid').innerHTML = ps.length ? ps.map(p => `<div class="c"><div class="ph">${p.cara
      ? `<img alt="" src="/api/cara/${encodeURIComponent(p.id)}?v=${p.cara_v || 0}">` : esc(ini(p.nombre))}</div>
    <div class="in"><div class="nm">${esc(p.nombre)}</div>${p.actor ? `<div class="ac">${esc(p.actor)}</div>` : ''}
    ${p.calzado ? `<div class="sh">${esc(p.calzado)}</div>` : ''}${p.notas ? `<div class="nt">${esc(p.notas)}</div>` : ''}</div></div>`).join('')
    : '<div class="msg" style="grid-column:1/-1">No hay personajes con foto en este proyecto.</div>';
}
$('#cols').onchange = $('#todos').onchange = render;
$('#pr').onclick = async () => {        // esperar a que carguen todas las fotos antes de imprimir
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  window.print();
};
(async () => {
  try {
    data = await (await fetch('/api/personajes', {cache: 'no-store'})).json();
    $('#st').textContent = data.proyecto ? `Proyecto «${data.proyecto}»` : 'Abrí una sesión en Pro Tools: los personajes son del proyecto';
    render();
  } catch { $('#st').textContent = 'Sin conexión con SpotPad'; }
})();
</script>
</body>
</html>
