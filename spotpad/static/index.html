<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121214">
<title>SpotPad</title>
<style>
:root{
  --bg:#121214; --panel:#1b1b1f; --panel2:#24242a; --line:#2f2f37;
  --text:#ecebe6; --dim:#8d8c94; --accent:#E8A33D; --ok:#5fc47e; --err:#e2574c;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:15px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}

header{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
.brand{font-weight:700;letter-spacing:.08em;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.off{background:var(--err)}
#session{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.hbtn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;
  padding:9px 14px;font:inherit;font-size:14px}
.hbtn:active{background:var(--line)}

main{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;padding:0 16px 16px;height:calc(100% - 60px)}
@media (max-width:820px){main{grid-template-columns:1fr;height:auto}}
section{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;min-height:0}
h2{margin:0 0 12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600;
  display:flex;justify-content:space-between;align-items:center}
h2 b{color:var(--accent);font-weight:600}

.cats{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.cat{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);font:inherit;font-size:14px}
.cat.sel{color:#121214;background:var(--cc,var(--accent));border-color:transparent;font-weight:600}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1;grid-auto-rows:minmax(84px,1fr)}
.pad{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);color:var(--text);
  font-family:inherit;font-weight:600;font-size:17px;line-height:1.2;text-align:left;padding:14px;display:flex;flex-direction:column;justify-content:space-between;
  transition:transform .06s, background .15s}
.pad .k{font:500 11px ui-monospace,Menlo,monospace;color:var(--dim)}
.pad .sub{color:var(--cc,var(--accent));font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.pad:active{transform:scale(.97);background:#2c2c33}
.pad.busy{opacity:.55}
.pad.flash-ok{background:color-mix(in srgb,var(--ok) 28%,var(--panel2))}
.pad.flash-err{background:color-mix(in srgb,var(--err) 30%,var(--panel2))}

.namebar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.namebar input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);
  font:inherit;font-size:16px;padding:10px 12px;-webkit-user-select:text;user-select:text}
.namebar input:focus{outline:none;border-color:var(--accent)}
.recents{display:flex;gap:6px;overflow-x:auto;margin:-2px 0 10px;min-height:0}
.recents:empty{display:none}
.chip{flex:none;border:1px solid var(--line);background:none;color:var(--dim);border-radius:999px;padding:6px 11px;font:inherit;font-size:13px}
.chip:active{background:var(--panel2)}
.gwrap{flex:1;overflow:auto;min-height:0}
.ghead{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:12px 2px 8px}
.ghead:first-child{margin-top:0}
.tgrid{margin-bottom:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;grid-auto-rows:72px}
.tpad{position:relative;border:1px solid var(--line);border-left:6px solid var(--tc,var(--line));border-radius:var(--r);
  background:var(--panel2);color:var(--text);font:inherit;font-weight:600;font-size:16px;text-align:left;padding:10px 12px;
  display:flex;flex-direction:column;justify-content:space-between;transition:transform .06s, background .15s}
.tpad .k{font:500 11px ui-monospace,Menlo,monospace;color:var(--dim)}
.tpad:active{transform:scale(.97);background:#2c2c33}
.tpad.busy{opacity:.55}
.tpad.flash-ok{background:color-mix(in srgb,var(--ok) 28%,var(--panel2))}
.tpad.flash-err{background:color-mix(in srgb,var(--err) 30%,var(--panel2))}
.cat.folder{border-style:solid}
.cathint{align-self:center;color:var(--dim);font-size:13px;padding:0 4px;white-space:nowrap}
.cat.preset{border-style:dashed}
.tpad .hide{position:absolute;top:6px;right:8px;font:600 11px ui-monospace,Menlo,monospace;color:var(--dim);display:none}
body.editing .tpad .hide{display:block}
body.editing .tpad{outline:1.5px dashed var(--line);outline-offset:-4px}
.tpad.hidden-t{opacity:.45}
.fbar{display:none;gap:8px;margin-bottom:10px;align-items:center;color:var(--dim);font-size:13px}
body.editing .fbar{display:flex}
.fbar span{flex:1}
.cat.hiddentab{border-style:dotted}
.pad .dest{font:500 11px ui-monospace,Menlo,monospace;color:var(--dim);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad .dest.miss{color:#ffb4ac}
body.editing .pad{outline:1.5px dashed var(--accent);outline-offset:-4px}
.pad.add{border-style:dashed;color:var(--dim);align-items:center;justify-content:center;font-size:15px}
#editBtn.on{background:var(--accent);color:#121214;border-color:var(--accent)}
.cat.add{border-style:dashed;color:var(--dim)}
.ef{padding:14px 16px;display:grid;gap:12px}
.ef label{display:grid;gap:6px;font-size:13px;color:var(--dim)}
.ef input,.ef select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);
  font:inherit;font-size:16px;padding:10px 12px;-webkit-user-select:text;user-select:text;width:100%}
.ef input[type=color]{padding:2px;height:42px}
.ebtns{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.ebtns .hbtn{flex:1}
.hbtn.danger{color:#ffb4ac;border-color:#5a2a26}
.peek{border:1px dashed var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.peek .lbl{font-size:11px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.peek .name{font-size:18px;font-weight:600;margin-top:4px;min-height:22px}
.peek .src{font-size:12px;color:var(--dim)}
.targets{display:flex;flex-direction:column;gap:8px;overflow:auto;flex:1}
.tgt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel2);border-radius:var(--r);
  padding:14px;color:var(--text);font:inherit;text-align:left;min-height:62px}
.tgt:active{background:#2c2c33}
.tgt .n{font:600 12px ui-monospace,Menlo,monospace;color:#121214;background:var(--accent);border-radius:6px;padding:3px 7px}
.tgt .t{font-size:16px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgt .arrow{color:var(--dim);font-size:13px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--dim);font:inherit;font-weight:600;font-size:16px;padding:12px;border-radius:9px;letter-spacing:.04em}
.seg button.sel{background:var(--accent);color:#121214}
.empty{color:var(--dim);font-size:14px;padding:10px 2px}

dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:0;
  width:min(520px,92vw);max-height:80vh}
dialog::backdrop{background:#000a}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlist{overflow:auto;max-height:60vh;padding:6px 8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:10px}
.row:active{background:var(--panel2)}
.row .ix{width:28px;color:var(--dim);font:12px ui-monospace,Menlo,monospace}
.row .nm{flex:1}
.chk{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;
  font:700 12px ui-monospace,Menlo,monospace;color:#121214}
.row.on .chk{background:var(--accent);border-color:var(--accent)}

.views{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px}
.views button{border:0;background:none;color:var(--dim);font:inherit;font-size:14px;font-weight:600;padding:7px 14px;border-radius:7px}
.views button.sel{background:var(--accent);color:#121214}
.views .badge{display:inline-block;min-width:18px;margin-left:6px;padding:1px 5px;border-radius:9px;background:var(--err);color:#fff;font-size:11px;text-align:center}
.views .badge:empty{display:none}
#viewList{display:none;padding:0 16px 16px;height:calc(100% - 60px)}
body.list #viewPads{display:none}
body.list #viewList{display:flex}
#viewList section{flex:1}
.ltools{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.lstat{flex:1;color:var(--dim);font-size:13px;min-width:160px}
.lstat.paused{color:var(--accent)}
.clips{overflow:auto;flex:1;margin:0 -6px}
.clip{display:grid;grid-template-columns:118px 1fr auto;gap:2px 14px;align-items:center;padding:11px 10px;border-radius:10px;border-bottom:1px solid var(--line)}
.clip:active{background:var(--panel2)}
.clip .tin{font:600 16px ui-monospace,"SF Mono",Menlo,monospace}
.clip .tout{font:12px ui-monospace,"SF Mono",Menlo,monospace;color:var(--dim)}
.clip .cn{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clip .tr{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clip .du{grid-row:span 2;font:12px ui-monospace,Menlo,monospace;color:var(--dim);text-align:right}
.clip.new{background:color-mix(in srgb,var(--accent) 14%,transparent);border-left:3px solid var(--accent)}
.clip.new .cn::after{content:"NUEVO";margin-left:8px;font:700 10px ui-monospace,Menlo,monospace;color:#121214;background:var(--accent);border-radius:4px;padding:2px 5px;vertical-align:2px}
.clip.here{outline:1.5px solid var(--ok)}

.conn{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;color:inherit;font:inherit;text-align:left;padding:0;cursor:pointer}
#reconBtn{display:none;border-color:var(--err);color:#ffb4ac}
body.offline #reconBtn{display:inline-block}
.st{padding:12px 16px;display:grid;gap:10px;font-size:14px}
.st .row2{display:flex;justify-content:space-between;gap:12px}
.st .k2{color:var(--dim)}
.st .v2{text-align:right;word-break:break-word}
.st .bad{color:#ffb4ac}
.st .warn{color:var(--accent)}
.hist{font:12px ui-monospace,Menlo,monospace;color:var(--dim);max-height:30vh;overflow:auto;border-top:1px solid var(--line);padding-top:8px}
.hist div{display:flex;gap:8px;padding:2px 0}
.hist .c{flex:1;color:var(--text)}
.hist .e{color:#ffb4ac}
.sbtns{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.sbtns .hbtn{flex:1}

/* ----- vista Grabar ----- */
#viewRec{display:none;padding:0 16px 16px;gap:14px;height:calc(100% - 60px)}
body.rec #viewPads, body.rec #viewList{display:none}
body.rec #viewRec{display:grid;grid-template-columns:330px 1fr}
@media (max-width:820px){body.rec #viewRec{grid-template-columns:1fr;height:auto}}
.rs{display:grid;gap:12px;overflow:auto;align-content:start}
.rs .lbl2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.rs select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;font-size:15px;padding:9px 10px}
.swp{display:flex;flex-wrap:wrap;gap:6px}
.swp .chip{border-left:4px solid var(--tc,var(--line))}
.swp .chip.on{background:var(--accent);color:#121214;border-color:var(--accent);border-left-color:var(--tc,var(--accent))}
.swp .chip .n{opacity:.7;margin-left:4px;font:11px ui-monospace,Menlo,monospace}
.sgh{font-size:11px;color:var(--dim);margin:8px 0 4px}
.tog{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text)}
.tog input{width:20px;height:20px;accent-color:var(--accent)}
.rmain{display:flex;flex-direction:column;min-height:0;gap:12px}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim)}
.prog .bar{flex:1;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ok)}
.card{border:1px solid var(--line);border-radius:18px;background:var(--panel2);padding:18px;display:grid;gap:10px}
.card .tcs{font:600 22px ui-monospace,"SF Mono",Menlo,monospace}
.card .tcs small{font-size:14px;color:var(--dim);font-weight:400;margin-left:8px}
.card .src{font-size:13px;color:var(--dim)}
.card .nm{font-size:28px;font-weight:700;line-height:1.15;word-break:break-word;cursor:text}
.card .nm.auto::after{content:"auto";font:600 10px ui-monospace,Menlo,monospace;color:#121214;background:var(--dim);border-radius:4px;padding:2px 5px;margin-left:8px;vertical-align:6px}
.card .nm.editado::after{content:"editado";font:600 10px ui-monospace,Menlo,monospace;color:#121214;background:var(--accent);border-radius:4px;padding:2px 5px;margin-left:8px;vertical-align:6px}
.card input.nmi{font-size:24px;font-weight:700;background:var(--bg);border:1px solid var(--accent);border-radius:10px;color:var(--text);padding:8px 10px;width:100%;-webkit-user-select:text;user-select:text}
.card .hint{font-size:12px;color:var(--dim)}
.need{border:1px solid var(--accent);border-radius:12px;padding:10px;display:grid;gap:8px}
.need b{font-size:13px;color:var(--accent)}
.need .opts{display:flex;flex-wrap:wrap;gap:8px}
.need .opts button{flex:1 1 140px;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-weight:600;font-size:16px}
.need .opts button:active{background:var(--line)}
.ctl{display:grid;grid-template-columns:1fr 1fr 1.2fr 1.6fr;gap:10px}
.ctl button{min-height:64px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;font-weight:700;font-size:17px}
.ctl button:active{transform:scale(.98)}
.ctl .next{background:var(--accent);color:#121214;border-color:var(--accent)}
.ctl .done.on{background:color-mix(in srgb,var(--ok) 35%,var(--panel2));border-color:var(--ok)}
.queue{overflow:auto;flex:1;min-height:120px;border-top:1px solid var(--line)}
.qi{display:grid;grid-template-columns:104px 1fr auto;gap:2px 12px;padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.qi .t{font:13px ui-monospace,Menlo,monospace;color:var(--dim)}
.qi .q{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qi .w{font:600 11px ui-monospace,Menlo,monospace;color:var(--accent)}
.qi.cur{background:color-mix(in srgb,var(--accent) 16%,transparent);border-left:3px solid var(--accent)}
.qi.gone{opacity:.4;text-decoration:line-through}
.rempty{color:var(--dim);padding:20px 4px;font-size:15px;line-height:1.5}
.rules table{width:100%;border-collapse:collapse;font-size:14px}
.rules td{padding:6px 4px;border-bottom:1px solid var(--line)}
.rules select,.rules input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);font:inherit;padding:6px;width:100%;-webkit-user-select:text;user-select:text}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}

.clip .ren{grid-row:span 2;border:1px solid var(--line);background:none;color:var(--dim);border-radius:8px;font:inherit;font-size:13px;padding:6px 9px}
.clip{grid-template-columns:118px 1fr auto auto}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches button{width:34px;height:34px;border-radius:8px;border:2px solid transparent}
.swatches button.sel{border-color:var(--text);box-shadow:0 0 0 2px var(--bg) inset}
.swatches button.none{background:var(--panel2);color:var(--dim);font-size:12px;width:auto;padding:0 10px;border-color:var(--line)}
.card .cren{background:none;border:0;color:var(--dim);font:inherit;font-size:12px;text-decoration:underline;padding:0;justify-self:start}
.qi.extra .q::before{content:"fuera del barrido · ";color:var(--dim)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--panel2);border:1px solid var(--line);padding:12px 18px;border-radius:12px;opacity:0;
  transition:.2s;max-width:90vw;font-size:15px;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.err{border-color:var(--err);color:#ffb4ac}
</style>
</head>
<body>
<header>
  <button class="conn" id="conn" title="Estado de la conexión">
    <span class="dot" id="dot"></span>
    <span class="brand">SPOTPAD</span>
    <span id="session" class="mono">conectando…</span>
  </button>
  <button class="hbtn" id="reconBtn">↻ Reconectar</button>
  <div class="views"><button id="vPads" class="sel">Botonera</button><button id="vList">Lista<span class="badge" id="newCount"></span></button><button id="vRec">Grabar</button></div>
  <button class="hbtn" id="undo">↶ Deshacer</button>
</header>

<main id="viewPads">
  <section>
    <h2><span>Spotting · marcá la región y tocá</span><span style="display:flex;gap:8px"><button class="hbtn" id="markBtn" title="Marcador en el inicio de la selección">⚑ Escena</button><button class="hbtn" id="editBtn">✎ Editar</button><button class="hbtn" id="reload">↻ Tracks</button></span></h2>
    <div class="cats" id="cats"></div>
    <div class="namebar" id="namebar"><input id="clipName" placeholder="Nombre del clip (vacío = nombre del track)" autocomplete="off" autocapitalize="words"><button class="hbtn" id="clearName">×</button></div>
    <div class="recents" id="recents"></div>
    <div class="gwrap" id="gwrap"></div>
  </section>

  <section>
    <h2><span>Renombrar track</span><button class="hbtn" id="edit">Elegir tracks</button></h2>
    <div class="seg" id="seg"></div>
    <div class="peek" id="peek">
      <div class="lbl">Clip seleccionado · tocá para leer</div>
      <div class="name" id="peekName">—</div>
      <div class="src mono" id="peekSrc"></div>
    </div>
    <div class="targets" id="targets"></div>
  </section>
</main>

<div id="viewList">
  <section>
    <div class="ltools">
      <span class="lstat" id="lstat">—</span>
      <button class="hbtn" id="seen">Marcar vistos</button>
      <button class="hbtn" id="refresh">↻ Actualizar</button>
      <button class="hbtn" id="spotEdit">Tracks de spotting</button>
    </div>
    <div class="clips" id="clips"></div>
  </section>
</div>

<dialog id="dlg">
  <div class="dhead"><b id="dlgTitle">Tracks destino</b><button class="hbtn" id="done">Listo</button></div>
  <div class="dlist" id="dlist"></div>
</dialog>

<div id="viewRec">
  <section class="rs">
    <div><div class="lbl2">Qué barrer</div><div class="swp" id="recSweep"></div></div>
    <div><div class="lbl2">Solo pasos sobre la superficie</div><select id="recSurf"></select></div>
    <div><div class="lbl2">Track de grabación (se renombra solo)</div><select id="recTrack"></select></div>
    <label class="tog"><input type="checkbox" id="recAuto"> Renombrar el track al ir a cada clip</label>
    <label class="tog"><input type="checkbox" id="recFollow"> Seguir Pro Tools (clic en un clip de spotting → aparece acá)</label>
    <label class="tog"><input type="checkbox" id="recShowDone"> Mostrar también los ya grabados</label>
    <div style="display:flex;gap:8px"><button class="hbtn" id="recRefresh" style="flex:1">↻ Leer sesión</button><button class="hbtn" id="recRulesBtn">⚙ Reglas de pasos</button></div>
    <div class="hint" id="recAt" style="font-size:12px;color:var(--dim)"></div>
    <div id="recKeys" style="font-size:12px;color:var(--dim);line-height:1.6"></div>
  </section>
  <section class="rmain">
    <div class="prog"><span id="recProg">—</span><span class="bar"><i id="recBar" style="width:0"></i></span></div>
    <div id="recCard"></div>
    <div class="ctl">
      <button id="recPrev">◀ Anterior</button>
      <button id="recGo">⟳ Ir</button>
      <button id="recDone" class="done">✓ Grabado</button>
      <button id="recNext" class="next">Siguiente ▶</button>
    </div>
    <div class="queue" id="recQueue"></div>
  </section>
</div>

<dialog id="recRules" class="rules">
  <div class="dhead"><b>Reglas de pasos</b><button class="hbtn" id="rrClose">Listo</button></div>
  <div class="dlist" id="rrBody"></div>
</dialog>

<dialog id="edItem">
  <div class="dhead"><b id="edItemTitle">Botón</b><button class="hbtn" id="edItemCancel">Cancelar</button></div>
  <div class="ef">
    <label>Nombre del clip group<input id="edName" autocomplete="off" autocapitalize="words" placeholder="Hands surface wood"></label>
    <label>Track destino<select id="edTrack"></select></label>
  </div>
  <div class="ebtns"><button class="hbtn danger" id="edDelete">Borrar</button><button class="hbtn" id="edSave">Guardar</button></div>
</dialog>

<dialog id="edCat">
  <div class="dhead"><b id="edCatTitle">Categoría</b><button class="hbtn" id="edCatCancel">Cancelar</button></div>
  <div class="ef">
    <label>Nombre de la pestaña<input id="ecLabel" autocomplete="off" autocapitalize="words" placeholder="Sillas"></label>
    <label>Color<input id="ecColor" type="color" value="#E8A33D"></label>
    <label>Track destino por defecto (para botones sin track propio)<select id="ecTrack"></select></label>
  </div>
  <div class="ebtns"><button class="hbtn danger" id="ecDelete">Borrar categoría</button><button class="hbtn" id="ecSave">Guardar</button></div>
</dialog>

<dialog id="ask">
  <div class="dhead"><b id="askTitle">—</b><button class="hbtn" id="askCancel">Cancelar</button></div>
  <div class="ef">
    <label id="askLabel">Nombre<input id="askInput" autocomplete="off" autocapitalize="words"></label>
    <div id="askColors" style="display:none"><div style="font-size:13px;color:var(--dim);margin-bottom:6px">Color</div><div class="swatches" id="askSw"></div></div>
    <div id="askHint" style="font-size:12px;color:var(--dim)"></div>
  </div>
  <div class="ebtns"><button class="hbtn" id="askOk">Aceptar</button></div>
</dialog>

<dialog id="stat">
  <div class="dhead"><b>Estado</b><button class="hbtn" id="statClose">Cerrar</button></div>
  <div class="st" id="stBody"></div>
  <div class="sbtns">
    <button class="hbtn" id="stRecon">↻ Reconectar</button>
    <button class="hbtn" id="stReport">Informe para soporte</button>
  </div>
</dialog>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let presets = [], catIdx = 0, tracks = [], targets = [], prefix = '', prefixOpts = [], lastClip = '';

async function api(path, opts = {}) {
  const r = await fetch(path, {headers: {'Content-Type': 'application/json'}, ...opts});
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.ok === false) throw new Error(j.error || `Error ${r.status}`);
  return j;
}

let toastT;
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = err ? 'err' : '', err ? 3500 : 1600);
}
function buzz(ok) { try { navigator.vibrate && navigator.vibrate(ok ? 15 : [40, 40, 40]); } catch {} }

/* ---------- estado de conexión ---------- */
async function poll() {
  try {
    const s = await api('/api/status');
    $('#dot').className = 'dot ' + (s.connected ? 'on' : 'off');
    document.body.classList.toggle('offline', !s.connected);
    // Al conectarse con Pro Tools, traer las carpetas de la sesión
    if (s.connected && !wasConnected) loadLayout(true);
    wasConnected = !!s.connected;
    $('#session').textContent = s.connected ? s.session + (s.mock ? '  ·  MOCK' : '') : s.error;
    if (s.connected && s.session !== sessionName) { const first = !sessionName; sessionName = s.session; seen = null; if (!first) loadLayout(true); }
    // Avisos de Pro Tools (sesión abierta/cerrada, track renombrado)
    if (evSeq === null) evSeq = s.ev_seq || 0;
    else if (s.ev_seq > evSeq && s.ev_last) {
      evSeq = s.ev_seq; const ev = s.ev_last;
      toast('Pro Tools: ' + ev.label + (ev.data && (ev.data.session_name || ev.data.new_name) ? ' · ' + (ev.data.session_name || ev.data.new_name) : ''));
      loadLayout(true);
      if (document.body.classList.contains('rec')) setTimeout(recEnter, 3000);
    }
    evStatus = s.ev_status || '';
  } catch { $('#dot').className = 'dot off'; $('#session').textContent = 'sin conexión con la computadora'; document.body.classList.remove('offline'); }
}

/* ---------- diálogo genérico (nombre + color) ---------- */
let palette = null;
async function getPalette() {
  if (palette) return palette;
  try { palette = (await api('/api/palette')).colors || []; } catch { palette = []; }
  return palette;
}
function ask({title, label = 'Nombre', value = '', hint = '', colors = null}) {
  return new Promise(resolve => {
    $('#askTitle').textContent = title; $('#askLabel').firstChild.textContent = label;
    $('#askInput').value = value; $('#askHint').textContent = hint;
    let color = -1;
    const sw = $('#askSw'); sw.innerHTML = '';
    $('#askColors').style.display = colors && colors.length ? '' : 'none';
    if (colors && colors.length) {
      const none = document.createElement('button'); none.className = 'none sel'; none.textContent = 'Sin color';
      none.onclick = () => { color = -1; sw.querySelectorAll('button').forEach(b => b.classList.remove('sel')); none.classList.add('sel'); };
      sw.append(none);
      colors.forEach((c, i) => {
        const b = document.createElement('button'); b.style.background = tcolor(c) || c;
        b.onclick = () => { color = i; sw.querySelectorAll('button').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); };
        sw.append(b);
      });
    }
    const done = v => { $('#ask').close(); resolve(v); };
    $('#askOk').onclick = () => { const v = $('#askInput').value.trim(); if (!v) return toast('Poné un nombre', true); done({name: v, color}); };
    $('#askCancel').onclick = () => done(null);
    $('#askInput').onkeydown = e => { if (e.key === 'Enter') $('#askOk').click(); };
    $('#ask').showModal(); setTimeout(() => { $('#askInput').focus(); $('#askInput').select(); }, 50);
  });
}
async function renameClip(c, after) {
  const r = await ask({title: 'Renombrar clip de spotting', value: c.clip || '', hint: `${c.track} · ${c.tc_in || ''}`});
  if (!r) return;
  try { const x = await api('/api/clip/rename', {method: 'POST', body: JSON.stringify({track: c.track, start: c.start, end: c.end, name: r.name})});
        toast(x.msg); buzz(true); if (after) after(r.name); }
  catch (e) { toast(e.message, true); }
}
$('#markBtn').onclick = async () => {
  const r = await ask({title: 'Marcador de escena', label: 'Nombre', value: 'Esc ', hint: 'Se crea en el inicio de la selección de Pro Tools.', colors: await getPalette()});
  if (!r) return;
  try { const x = await api('/api/marker', {method: 'POST', body: JSON.stringify({name: r.name, color_index: r.color})}); toast(x.msg); buzz(true); }
  catch (e) { toast(e.message, true); }
};
async function createTrackIn(tab) {
  const last = tab.groups.flatMap(g => g.tracks).slice(-1)[0];
  if (!last) return toast('La carpeta no tiene tracks para ubicar el nuevo', true);
  const r = await ask({title: `Nuevo track en ${tab.name}`, label: 'Nombre del track', hint: `Se crea mono, después de «${last.name}».`, colors: await getPalette()});
  if (!r) return;
  try { const x = await api('/api/track/create', {method: 'POST', body: JSON.stringify({name: r.name, after: last.name, color_index: r.color})});
        toast(x.msg); buzz(true); setTimeout(() => loadLayout(true), 600); }
  catch (e) { toast(e.message, true); }
}

/* ---------- estado, reconexión e informe ---------- */
async function reconnect() {
  toast('Reconectando…');
  try { const r = await api('/api/reconnect', {method: 'POST'}); toast('Conectado · ' + (r.session || '')); buzz(true); }
  catch (e) { toast(e.message, true); }
  await poll(); if ($('#stat').open) renderStat();
}
async function renderStat() {
  const b = $('#stBody'); b.innerHTML = '<div class="k2">Leyendo…</div>';
  let h; try { h = await (await fetch('/api/health')).json(); }
  catch { b.innerHTML = '<div class="bad">No hay conexión con la computadora (¿está abierto SpotPad?)</div>'; return; }
  const row = (k, v, cls = '') => `<div class="row2"><span class="k2">${k}</span><span class="v2 ${cls}">${v}</span></div>`;
  const esc = t => String(t).replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
  let html = row('Versión', esc(h.version));
  html += row('Pro Tools', $('#dot').classList.contains('on') ? 'conectado' : 'sin conexión', $('#dot').classList.contains('on') ? '' : 'bad');
  if (h.inflight) html += row('Esperando respuesta', `${esc(h.inflight.command)} · ${h.inflight.seconds} s`, h.inflight.seconds > 5 ? 'warn' : '');
  if (h.needs_pt_restart) html += '<div class="bad"><b>Pro Tools dejó de aceptar conexiones del SDK.</b> Guardá, cerrá y volvé a abrir Pro Tools: SpotPad se reconecta solo.</div>';
  else if (h.stuck) html += row('Pedido colgado', 'sí — tocá Reconectar', 'bad');
  html += row('Última respuesta OK', h.last_ok || '—');
  if (h.last_error) html += row('Último error', `${esc(h.last_error.msg)} (${h.last_error.at})`, 'bad');
  html += row('Conexiones', h.connections);
  html += row('Avisos de Pro Tools', esc(evStatus || '—'));
  html += '<div class="hist">' + (h.history || []).map(x =>
    `<div><span>${x.at}</span><span class="c">${esc(x.command)}</span><span>${x.ms} ms</span>${x.result === 'ok' ? '' : `<span class="e">${esc(x.result)}</span>`}</div>`
  ).join('') + '</div>';
  b.innerHTML = html;
}
$('#conn').onclick = () => { $('#stat').showModal(); renderStat(); };
$('#statClose').onclick = () => $('#stat').close();
$('#reconBtn').onclick = reconnect;
$('#stRecon').onclick = reconnect;
$('#stReport').onclick = () => window.open('/api/report', '_blank');

/* ---------- parte 1: botonera ---------- */
// Pestañas: una por carpeta de la sesión (Surfaces, Footsteps, Props…) + las de presets.json
let layout = {tabs: []}, tabKey = null, wasConnected = false, layoutErr = '';
let hidden = {folders: [], tracks: []};
const low = x => String(x).trim().toLowerCase();
const isHidF = n => hidden.folders.some(x => low(x) === low(n));
const isHidT = n => hidden.tracks.some(x => low(x) === low(n));
async function loadHidden() { hidden = await api('/api/hidden').catch(() => hidden); }
async function saveHidden(msg) {
  try { hidden = await api('/api/hidden', {method: 'PUT', body: JSON.stringify(hidden)}); toast(msg); buzz(true); }
  catch (e) { toast(e.message, true); }
  renderCats(); renderGrid();
}
function toggleIn(list, n) {
  const i = list.findIndex(x => low(x) === low(n));
  if (i >= 0) list.splice(i, 1); else list.push(n);
  return i < 0;
}
// Pestaña «Ocultos»: carpetas ocultas enteras + tracks ocultos sueltos
function hiddenTab() {
  const groups = [];
  layout.tabs.forEach(t => {
    if (isHidF(t.name)) { t.groups.forEach(g => groups.push({name: t.name + (g.name ? ' › ' + g.name : ''), tracks: g.tracks, folder: t.name})); return; }
    t.groups.forEach(g => {
      const tr = g.tracks.filter(x => isHidT(x.name));
      if (tr.length) groups.push({name: t.name + (g.name ? ' › ' + g.name : ''), tracks: tr});
    });
  });
  return groups.length ? {name: 'Ocultos', groups, hiddenView: true} : null;
}
const ls = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
function allTabs() {
  const vis = layout.tabs.filter(t => !isHidF(t.name)).map(t => ({...t,
    groups: t.groups.map(g => ({...g, tracks: g.tracks.filter(x => !isHidT(x.name))})).filter(g => g.tracks.length)}));
  const h = hiddenTab();
  return [...vis.map(t => ({key: 'f:' + t.name, label: t.name, kind: 'folder', tab: t})),
          ...presets.map(p => ({key: 'p:' + p.id, label: p.label, kind: 'preset', cat: p})),
          ...(h ? [{key: 'h:ocultos', label: `Ocultos (${h.groups.reduce((n, g) => n + g.tracks.length, 0)})`, kind: 'folder', tab: h, hiddenTab: true}] : [])];
}
function tcolor(c) {
  if (!c) return '';
  let h = String(c).replace(/^#/, '');
  if (/^[0-9a-f]{8}$/i.test(h)) h = h.slice(2);          // ARGB → RGB
  return /^[0-9a-f]{6}$/i.test(h) ? '#' + h : '';
}
async function loadLayout(quiet) {
  try { layout = await api('/api/layout'); layoutErr = ''; }
  catch (e) { layout = {tabs: []}; layoutErr = e.message; if (!quiet) toast(e.message, true); }
  const tabs = allTabs();
  if (!tabs.find(t => t.key === tabKey)) tabKey = ls.get('spotpad.tab', null);
  if (!tabs.find(t => t.key === tabKey)) tabKey = tabs[0] && tabs[0].key;
  renderCats(); renderGrid();
}
function renderCats() {
  const c = $('#cats'); c.innerHTML = '';
  if (!layout.tabs.length) {
    const n = document.createElement('span'); n.className = 'cathint';
    n.textContent = layoutErr ? 'Carpetas de la sesión: sin conexión con Pro Tools' : 'No hay carpetas con tracks en la sesión';
    c.append(n);
  }
  allTabs().forEach(t => {
    const b = document.createElement('button');
    b.className = 'cat ' + t.kind + (t.hiddenTab ? ' hiddentab' : '') + (t.key === tabKey ? ' sel' : ''); b.textContent = t.label;
    if (t.cat) b.style.setProperty('--cc', t.cat.color);
    b.onclick = () => { tabKey = t.key; ls.set('spotpad.tab', tabKey); $('#clipName').value = ''; renderCats(); renderGrid(); loadLayout(true); };
    c.append(b);
  });
  if (editing) {
    const a = document.createElement('button'); a.className = 'cat add'; a.textContent = '+ Categoría';
    a.onclick = () => openCat(null); c.append(a);
  }
}
function renderGrid() {
  const w = $('#gwrap'), t = allTabs().find(t => t.key === tabKey); w.innerHTML = '';
  $('#namebar').style.display = $('#recents').style.display = (t && t.kind === 'folder') ? '' : 'none';
  if (!t) { w.innerHTML = '<div class="empty">No encontré carpetas con tracks en la sesión.</div>'; return; }
  if (t.kind === 'preset') return renderPresetGrid(w, t.cat);
  // Barra de edición: ocultar la carpeta entera (o, en Ocultos, explicar cómo volver)
  const bar = document.createElement('div'); bar.className = 'fbar';
  if (t.hiddenTab) {
    bar.innerHTML = '<span>Tocá un track (o «Mostrar carpeta») para que vuelva a su pestaña.</span>';
  } else {
    bar.innerHTML = '<span>Tocá un track para ocultarlo, o ocultá toda la carpeta.</span><button class="hbtn" data-a="new">+ Track</button><button class="hbtn" data-a="hide">Ocultar carpeta</button>';
    bar.querySelector('[data-a=hide]').onclick = () => { toggleIn(hidden.folders, t.tab.name); tabKey = null; saveHidden(`Carpeta «${t.tab.name}» oculta`); };
    bar.querySelector('[data-a=new]').onclick = () => createTrackIn(layout.tabs.find(x => x.name === t.tab.name) || t.tab);
  }
  w.append(bar);
  let n = 0;
  t.tab.groups.forEach(g => {
    if (g.name || t.hiddenTab) {
      const h = document.createElement('div'); h.className = 'ghead'; h.textContent = g.name; w.append(h);
      if (t.hiddenTab && g.folder && editing) {
        const sb = document.createElement('button'); sb.className = 'hbtn'; sb.style.marginLeft = '8px'; sb.textContent = 'Mostrar carpeta';
        sb.onclick = () => { toggleIn(hidden.folders, g.folder); saveHidden(`Carpeta «${g.folder}» visible`); };
        h.append(sb);
      }
    }
    const grid = document.createElement('div'); grid.className = 'tgrid'; w.append(grid);
    g.tracks.forEach(tr => {
      const b = document.createElement('button'); b.className = 'tpad';
      const col = tcolor(tr.color); if (col) b.style.setProperty('--tc', col);
      b.innerHTML = '<span class="k"></span><span class="lab"></span><span class="hide"></span>';
      b.querySelector('.k').textContent = ++n; b.querySelector('.lab').textContent = tr.name;
      b.querySelector('.hide').textContent = t.hiddenTab ? 'mostrar' : 'ocultar';
      b.onclick = async () => {
        if (editing) {
          if (t.hiddenTab && g.folder && !isHidT(tr.name)) {   // track de carpeta oculta → mostrar la carpeta
            toggleIn(hidden.folders, g.folder); return saveHidden(`Carpeta «${g.folder}» visible`);
          }
          const nowHidden = toggleIn(hidden.tracks, tr.name);
          return saveHidden(nowHidden ? `«${tr.name}» oculto` : `«${tr.name}» visible`);
        }
        if (b.classList.contains('busy')) return;
        b.classList.add('busy');
        const name = $('#clipName').value.trim();
        try { const r = await api('/api/group-on/' + encodeURIComponent(tr.id), {method: 'POST', body: JSON.stringify({name})});
              flash(b, true); toast(r.msg); if (name) { addRecent(name); $('#clipName').value = ''; } }
        catch (e) { flash(b, false); toast(e.message, true); }
        b.classList.remove('busy');
      };
      grid.append(b);
    });
  });
}
// Nombres recientes del campo (p. ej. personajes en tracks de calzado: Sonia, Extra Left)
function addRecent(n) {
  const r = ls.get('spotpad.recent', []).filter(x => x !== n); r.unshift(n);
  ls.set('spotpad.recent', r.slice(0, 15)); renderRecents();
}
function renderRecents() {
  const box = $('#recents'); box.innerHTML = '';
  ls.get('spotpad.recent', []).forEach(n => {
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = n;
    b.onclick = () => { $('#clipName').value = n; buzz(true); };
    box.append(b);
  });
}
$('#clearName').onclick = () => { $('#clipName').value = ''; $('#clipName').blur(); };
$('#reload').onclick = async () => { await loadLayout(); buzz(true); };

/* ---------- botones preseteados (con track destino) + editor ---------- */
let editing = false;
const iName = it => (typeof it === 'string' ? it : (it.name || '')).trim();
const iTrack = (it, cat) => ((typeof it === 'object' && it.track) || (cat && cat.track) || '').trim();
const sessionTracks = () => layout.tabs.flatMap(t => t.groups.flatMap(g => g.tracks.map(tr => ({tab: t.name, name: tr.name}))));
const hasTrack = n => sessionTracks().some(t => t.name.trim().toLowerCase() === n.trim().toLowerCase());

function renderPresetGrid(w, cat) {
  const g = document.createElement('div'); g.className = 'grid'; w.append(g);
  cat.items.forEach((it, i) => {
    const name = iName(it), track = iTrack(it, cat);
    const b = document.createElement('button');
    b.className = 'pad'; b.style.setProperty('--cc', cat.color);
    const parts = name.split(' '), head = parts.shift();
    b.innerHTML = `<span class="k">${i + 1}</span><span><div class="sub"></div><div class="lab"></div><div class="dest"></div></span>`;
    b.querySelector('.sub').textContent = head;
    b.querySelector('.lab').textContent = parts.join(' ') || head;
    const d = b.querySelector('.dest');
    d.textContent = track ? '→ ' + track : '→ track seleccionado';
    if (track && layout.tabs.length && !hasTrack(track)) { d.classList.add('miss'); d.textContent = '→ ' + track + ' (no está)'; }
    b.onclick = async () => {
      if (editing) return openItem(cat, i);
      if (b.classList.contains('busy')) return;
      b.classList.add('busy');
      try { const r = await api('/api/group', {method: 'POST', body: JSON.stringify({name, track})});
            flash(b, true); toast(r.msg); }
      catch (e) { flash(b, false); toast(e.message, true); }
      b.classList.remove('busy');
    };
    g.append(b);
  });
  if (editing) {
    const add = document.createElement('button'); add.className = 'pad add'; add.textContent = '+ Botón';
    add.onclick = () => openItem(cat, -1); g.append(add);
    const ed = document.createElement('button'); ed.className = 'pad add'; ed.textContent = '✎ Categoría';
    ed.onclick = () => openCat(cat); g.append(ed);
  }
}

function fillTrackSelect(sel, current, emptyLabel) {
  sel.innerHTML = '';
  const o0 = document.createElement('option'); o0.value = ''; o0.textContent = emptyLabel; sel.append(o0);
  if (current && !hasTrack(current)) {
    const o = document.createElement('option'); o.value = current; o.textContent = current + ' (no está en esta sesión)'; sel.append(o);
  }
  layout.tabs.forEach(t => {
    const og = document.createElement('optgroup'); og.label = t.name;
    t.groups.forEach(g => g.tracks.forEach(tr => {
      const o = document.createElement('option'); o.value = tr.name; o.textContent = (g.name ? g.name + ' › ' : '') + tr.name; og.append(o);
    }));
    sel.append(og);
  });
  sel.value = current || '';
  if (sel.value !== (current || '')) {   // nombre con otra mayúscula/espacios
    const m = [...sel.options].find(o => o.value.trim().toLowerCase() === (current || '').trim().toLowerCase());
    if (m) sel.value = m.value;
  }
}
async function savePresets(msg) {
  try {
    const r = await api('/api/presets', {method: 'PUT', body: JSON.stringify({categories: presets})});
    presets = r.categories || []; toast(msg || 'Guardado'); buzz(true);
  } catch (e) { toast(e.message, true); presets = (await api('/api/presets')).categories || []; }
  renderCats(); renderGrid();
}
let edCtx = null;
function openItem(cat, i) {
  edCtx = {cat, i};
  const it = i >= 0 ? cat.items[i] : '';
  $('#edItemTitle').textContent = i >= 0 ? 'Editar botón' : 'Nuevo botón en ' + cat.label;
  $('#edName').value = i >= 0 ? iName(it) : '';
  fillTrackSelect($('#edTrack'), i >= 0 ? ((typeof it === 'object' && it.track) || '') : '',
                  cat.track ? `(el de la categoría: ${cat.track})` : '(el track que esté seleccionado)');
  $('#edDelete').style.display = i >= 0 ? '' : 'none';
  $('#edItem').showModal();
}
$('#edItemCancel').onclick = () => $('#edItem').close();
$('#edSave').onclick = () => {
  const name = $('#edName').value.trim(), track = $('#edTrack').value.trim();
  if (!name) return toast('Poné un nombre', true);
  const item = track ? {name, track} : name;
  const {cat, i} = edCtx;
  if (i >= 0) cat.items[i] = item; else cat.items.push(item);
  $('#edItem').close(); savePresets('Botón guardado');
};
$('#edDelete').onclick = () => {
  const {cat, i} = edCtx;
  if (!confirmTap($('#edDelete'))) return;

/* ---------- modo grabación ---------- */
let rec = {items: [], sweepable: [], shoes: [], surfaces: [], fts: []}, recSt = {}, recCur = null, recTracks = [];
const esc2 = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const pending = it => !it.muted && !it.done;
function recVisible() { return rec.items.filter(it => $('#recShowDone').checked || pending(it) || (recCur && it.key === recCur)); }

let recSig = '';
async function recPoll() {           // sigue lo que se hace con los atajos desde la computadora
  if (document.visibilityState !== 'visible' || !document.body.classList.contains('rec')) return;
  if (document.querySelector('#recName + input, input.nmi') || document.querySelector('dialog[open]')) return;
  const r = await api('/api/rec/queue').catch(() => null);
  if (!r || r.need_refresh) return;
  const sig = r.cur + '|' + r.items.map(i => i.key + (i.done ? 'd' : '') + i.name).join(',');
  if (sig !== recSig) { recSig = sig; if (r.cur) recCur = r.cur; recApply(r); }
}
setInterval(recPoll, 2000);
async function recEnter() {
  api('/api/hotkeys').then(h => {
    $('#recKeys').innerHTML = h.enabled && h.keys.length ? '<b style="color:var(--text)">Atajos en la computadora</b><br>' +
      h.keys.map(k => `<span class="mono" style="color:var(--text)">${esc2(k.label)}</span> ${esc2(k.desc)}`).join('<br>') : '';
  }).catch(() => {});
  recSt = await api('/api/rec/state').catch(() => ({}));
  $('#recAuto').checked = recSt.auto_rename !== false;
  $('#recFollow').checked = !!recSt.follow;
  recTracks = await api('/api/tracks').catch(() => []);
  const r = await api('/api/rec/queue').catch(() => null);
  if (r && !r.need_refresh) recApply(r); else await recRefresh();
  recRenderSetup();
}
async function recRefresh() {
  $('#recAt').textContent = 'Leyendo la sesión…';
  try {
    const r = await api('/api/rec/refresh', {method: 'POST'});
    if (r.paused) { toast('Pro Tools está grabando o reproduciendo: leo cuando pares', true); }
    recApply(r); recRenderSetup();
  } catch (e) { $('#recAt').textContent = ''; toast(e.message, true); }
}
function recApply(r) {
  if (!r || !r.items) return;
  rec = {...rec, ...r};
  $('#recAt').textContent = r.at ? `Sesión ${r.session} · leída ${r.at}` : '';
  if (r.cur && rec.items.some(i => i.key === r.cur)) recCur = r.cur;      // lo que se movió con los atajos
  const vis = recVisible();
  if (!recCur || !rec.items.some(i => i.key === recCur)) recCur = (vis.find(pending) || vis[0] || {}).key || null;
  recRender();
}
function recRenderSetup() {
  // Qué barrer: chips por tipo de carpeta, con pendientes por track
  const box = $('#recSweep'); box.innerHTML = '';
  const sweep = new Set(recSt.sweep || []);
  const counts = {}; rec.items.forEach(i => { if (pending(i)) counts[i.track] = (counts[i.track] || 0) + 1; });
  const groups = [['footsteps', 'Pasos'], ['props', 'Props'], ['surfaces', 'Superficies']];
  if (!rec.sweepable.length) box.innerHTML = '<div class="hint" style="color:var(--dim);font-size:13px">Tocá «Leer sesión». Se usan las carpetas de superficies, pasos y props.</div>';
  groups.forEach(([k, label]) => {
    const tr = rec.sweepable.filter(t => t.kind === k); if (!tr.length) return;
    const h = document.createElement('div'); h.className = 'sgh'; h.textContent = label; box.append(h);
    const wrap = document.createElement('div'); wrap.className = 'swp'; box.append(wrap);
    tr.forEach(t => {
      const b = document.createElement('button'); b.className = 'chip' + (sweep.has(t.name) ? ' on' : '');
      const col = tcolor(t.color); if (col) b.style.setProperty('--tc', col);
      b.innerHTML = `${esc2(t.name)}${sweep.has(t.name) && counts[t.name] ? `<span class="n">${counts[t.name]}</span>` : ''}`;
      b.onclick = async () => {
        sweep.has(t.name) ? sweep.delete(t.name) : sweep.add(t.name);
        recSt.sweep = [...sweep]; await recPutState({sweep: recSt.sweep}); recRenderSetup();
      };
      wrap.append(b);
    });
  });
  // Superficie
  const ss = $('#recSurf'); ss.innerHTML = '<option value="">Todas</option>' +
    (rec.surface_tracks || []).map(n => `<option>${esc2(n)}</option>`).join('');
  ss.value = recSt.surface_filter || '';
  // Track de grabación (cualquier track de la sesión)
  const rt = $('#recTrack');
  rt.innerHTML = '<option value="">(ninguno: solo posicionar)</option>' +
    recTracks.map(t => `<option value="${esc2(t.id)}">${esc2(t.name)}</option>`).join('');
  rt.value = recSt.rec_track || '';
}
async function recPutState(patch) {
  try { const r = await api('/api/rec/state', {method: 'PUT', body: JSON.stringify(patch)}); recApply(r); }
  catch (e) { toast(e.message, true); }
}

function recItem() { return rec.items.find(i => i.key === recCur); }

  $('#recProg').textContent = total ? `Pendientes ${pend} de ${total}` : 'Nada para barrer';

  } else {
    const src = it.kind === 'footsteps' && it.shoe ? ({color: 'calzado por color del track', clip: 'calzado por el nombre del clip', personaje: 'calzado fijado para el personaje', elegido: 'calzado elegido', track: ''}[it.shoe_src] || '') : '';
    card.innerHTML = `<div class="card">

      <div class="nm ${it.name_src}" id="recName" title="Tocá para editar">${esc2(it.name)}</div>
      <div class="hint">${src ? esc2(src) + ' · ' : ''}tocá el nombre para editarlo</div>

    $('#recName').onclick = () => recEditName(it);
    $('#recRenClip').onclick = () => renameClip({track: it.track, clip: it.clip, start: it.start, end: it.end, tc_in: it.tc_in},
                                                () => setTimeout(async () => recApply(await api('/api/rec/queue')), 300));
    const needs = $('#recNeeds');
    if (it.needs.includes('surface')) needs.append(recNeed('Choque de superficies: ¿sobre cuál camina?', it.surfaces, v => recChoose({key: it.key, surface: v})));
    if (it.needs.includes('shoe')) {
      const n = recNeed(`¿Qué calzado usa ${esc2(it.character || 'este personaje')}?`, rec.shoes, v =>
        $('#recRemember').checked && it.character ? recChoose({character: it.character, char_shoe: v}) : recChoose({key: it.key, shoe: v}));
      const lab = document.createElement('label'); lab.className = 'tog';

async function recChoose(body) {
  try { const r = await api('/api/rec/choice', {method: 'POST', body: JSON.stringify(body)}); recApply(r); buzz(true);
        const it = recItem(); if (it && !it.needs.length) recGo(it); }

}
function recEditName(it) {
  const el = $('#recName'); const inp = document.createElement('input'); inp.className = 'nmi'; inp.value = it.name;
  el.replaceWith(inp); inp.focus(); inp.select();
  const finish = async save => {

      const r = await api('/api/rec/choice', {method: 'POST', body: JSON.stringify({key: it.key, name: inp.value.trim()})}).catch(e => toast(e.message, true));
      if (r) { recApply(r); recGo(recItem()); }
    } else recRender();

async function recGo(it) {
  if (!it) return;
  const rename = $('#recAuto').checked && !it.needs.length;
  try { const r = await api('/api/rec/go', {method: 'POST', body: JSON.stringify({key: it.key, start: it.start, end: it.end, name: it.name, rename})});
        toast(it.needs.length ? 'Posicionado · elegí lo que falta para renombrar' : r.msg); buzz(true); }
  catch (e) { toast(e.message, true); }
}
function recSelect(key, go) { recCur = key; recRender(); if (go) recGo(recItem()); }
function recStep(dir) {
  // Recorre en orden de tiempo desde el actual (aunque el actual ya esté grabado)
  const all = rec.items, ok = x => pending(x) || $('#recShowDone').checked;
  if (!all.length) return;
  const i = all.findIndex(x => x.key === recCur);
  let j = i < 0 ? (dir > 0 ? 0 : all.length - 1) : i + dir;
  while (j >= 0 && j < all.length && !ok(all[j])) j += dir;
  if (j < 0 || j >= all.length) return toast(dir > 0 ? 'No hay más pendientes adelante' : 'No hay pendientes antes');
  recSelect(all[j].key, true);
}
$('#recPrev').onclick = () => recStep(-1);

        const was = it.done; recApply(r); buzz(true); if (!was) recStep(1); }

  const b = $('#rrBody');
  const shoeOpts = sel => '<option value="">(automático)</option>' + rec.shoes.map(s => `<option ${s === sel ? 'selected' : ''}>${esc2(s)}</option>`).join('');
  b.innerHTML = `<div class="hint" style="padding:8px 4px;color:var(--dim);font-size:13px">Tracks de personaje: el calzado sale del nombre del clip si lo trae; si no, del que fijes acá; si no, del color del track (igual al del track de calzado).</div>
    <table><tbody>${rec.fts.filter(t => t.type === 'char').map(t => `<tr>
      <td><span class="sw" style="background:${tcolor(t.color) || 'transparent'}"></span>${esc2(t.name)}</td>
      <td style="color:var(--dim);font-size:12px">${t.shoe_track ? 'por nombre: ' + esc2(t.shoe_track) : t.shoe_color ? 'por color: ' + esc2(t.shoe_color) : 'sin deducir'}</td>
      <td style="width:150px"><select data-char="${esc2(t.character)}">${shoeOpts(t.shoe_fixed)}</select></td></tr>`).join('')}</tbody></table>
    <div class="hint" style="padding:12px 4px 4px;color:var(--dim);font-size:13px">Tracks de calzado (el personaje sale del nombre del clip): ${rec.fts.filter(t => t.type === 'shoe').map(t => esc2(t.name)).join(', ') || '—'}</div>
    <div class="hint" style="padding:12px 4px 4px;color:var(--dim);font-size:13px">Nombre corto de cada superficie en el nombre de grabación (vacío = el nombre del track):</div>
    <table><tbody>${(rec.surface_tracks || []).map(n => `<tr><td>${esc2(n)}</td><td style="width:180px"><input data-surf="${esc2(n)}" value="${esc2((rec.surface_alias || {})[n] || '')}" placeholder="${esc2(n)}"></td></tr>`).join('')}</tbody></table>`;
  b.querySelectorAll('select[data-char]').forEach(sel => sel.onchange = () => recChoose({character: sel.dataset.char, char_shoe: sel.value}));
  b.querySelectorAll('input[data-surf]').forEach(inp => inp.onchange = async () => {
    const alias = {...(rec.surface_alias || {})}; if (inp.value.trim()) alias[inp.dataset.surf] = inp.value.trim(); else delete alias[inp.dataset.surf];
    const r = await api('/api/rec/rules', {method: 'PUT', body: JSON.stringify({surface_alias: alias})}).catch(e => toast(e.message, true));
    if (r && r.items) recApply(r);
  });
  $('#recRules').showModal();
};
$('#rrClose').onclick = () => { $('#recRules').close(); recRender(); };

(async () => {
  poll(); setInterval(poll, 4000);
  presets = (await api('/api/presets')).categories || [];
  renderRecents(); await loadHidden(); await loadLayout(true);
  if (ls.get('spotpad.view', 'pads') === 'rec') setView('rec');
  const pr = await api('/api/prefix'); prefix = pr.prefix; prefixOpts = pr.options; renderSeg();
  await Promise.all([loadTracks(), loadTargets()]); renderTargets();
})();
</script>
</body>
