<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141519">
<title>SpotPad</title>
<style>
/* ===== Temas ===== */
:root,[data-theme=estudio]{
  --bg:#141519; --surface:#1b1d22; --raised:#23262d; --press:#2b2f37; --line:#2e323b; --line2:#3a3f4a;
  --text:#edeef0; --dim:#8b909b; --faint:#5d626d; --accent:#f0b03f; --on-accent:#1d1505;
  --ok:#5cc98a; --err:#ef6a5e; --err-text:#ffb4ab; --shadow:none; --scrim:#000b;
}
[data-theme=cabina]{
  --bg:#0e1615; --surface:#132020; --raised:#1a2a29; --press:#213433; --line:#253836; --line2:#30484a;
  --text:#e3efec; --dim:#7c9893; --faint:#56706c; --accent:#5ed6b4; --on-accent:#05211a;
  --ok:#8fdc6e; --err:#f07a6a; --err-text:#ffb8ac; --shadow:none; --scrim:#000b;
}
[data-theme=noche]{
  --bg:#12131c; --surface:#191b27; --raised:#212433; --press:#2a2e40; --line:#2d3043; --line2:#3b3f57;
  --text:#e9eaf4; --dim:#8b8fa8; --faint:#61657d; --accent:#a99bff; --on-accent:#17113a;
  --ok:#6fd4a0; --err:#ff7a8a; --err-text:#ffb6c0; --shadow:none; --scrim:#000b;
}
[data-theme=dia]{
  --bg:#eceef1; --surface:#f8f9fa; --raised:#ffffff; --press:#e6e9ee; --line:#d9dde3; --line2:#c6ccd5;
  --text:#17191e; --dim:#626977; --faint:#9aa1ad; --accent:#b8720a; --on-accent:#ffffff;
  --ok:#1f9a55; --err:#c8372b; --err-text:#b3261e; --shadow:0 1px 2px #1b22300f,0 1px 1px #1b22300a; --scrim:#11151c66;
}
:root{--r:12px; --r-lg:18px; --tab-h:0px; --dock-h:0px; color-scheme:dark}
[data-theme=dia]{color-scheme:light}

/* ===== Base ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.tc{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Cabecera ===== */
header{display:flex;align-items:center;gap:10px;padding:12px 16px;flex:none}
.conn{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;text-align:left;padding:4px 0}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.dot.off{background:var(--err);box-shadow:0 0 0 3px color-mix(in srgb,var(--err) 22%,transparent)}
#session{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.hbtn{background:var(--raised);border:1px solid var(--line);color:var(--text);border-radius:10px;
  padding:9px 14px;font-size:14px;font-weight:500;box-shadow:var(--shadow);white-space:nowrap}
.hbtn:active{background:var(--press)}
.icon{display:inline-grid;place-items:center;min-width:40px;height:40px;padding:0 10px;border-radius:10px;
  background:none;border:1px solid transparent;color:var(--dim);font-size:15px;font-weight:600}
.icon:active{background:var(--press)}
#gearBtn{font-size:19px}
#gearBtn.upd{position:relative}
#gearBtn.upd::after{content:"";position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;
  background:var(--err);box-shadow:0 0 0 2px var(--bg)}
/* Aviso de actualización (debajo del encabezado) */
#updBar{display:flex;align-items:center;gap:10px;margin:8px 16px 6px;padding:8px 8px 8px 14px;border-radius:12px;
  background:color-mix(in srgb,var(--accent) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));
  position:relative;overflow:hidden;font-size:14px}
#updBar[hidden],#updBar [hidden]{display:none}
#updBar b{font-weight:650}
#updBar .grow{flex:1;min-width:0}
#updBar .hbtn{padding:7px 12px}
#updProg{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--accent);transition:width .4s}
#reconBtn{display:none;border-color:color-mix(in srgb,var(--err) 50%,var(--line));color:var(--err-text)}
body.offline #reconBtn{display:inline-block}

/* Vistas: segmentado arriba (iPad), barra inferior (teléfono) */
.views{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.views button{border:0;background:none;color:var(--dim);font-size:14px;font-weight:600;padding:8px 14px;border-radius:9px;position:relative}
.views button.sel{background:var(--raised);color:var(--text);box-shadow:var(--shadow),inset 0 -2px 0 var(--accent)}
.views .badge{display:inline-block;min-width:18px;margin-left:6px;padding:1px 5px;border-radius:9px;background:var(--err);color:#fff;font-size:11px;text-align:center;font-weight:700}
.views .badge:empty{display:none}

/* ===== Paneles ===== */
main,#viewList,#viewRec{flex:1;min-height:0;padding:0 16px calc(16px + var(--tab-h) + env(safe-area-inset-bottom))}
main{display:grid;grid-template-columns:1fr;gap:14px}
section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;min-height:0;box-shadow:var(--shadow)}
h2{margin:0 0 12px;font-size:15px;font-weight:650;color:var(--text);display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 b{color:var(--accent);font-weight:600}
.empty{color:var(--dim);font-size:14px;padding:14px 2px;line-height:1.5}

/* ===== Botonera ===== */
.toolbar{display:flex;align-items:flex-start;gap:6px;margin-bottom:10px;min-width:0}
main > section,#viewRec > section{min-width:0}
.cats{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.cats2{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px;min-width:0}
.cats2:empty{display:none}
.cats2 .cat{padding:6px 12px 6px 10px;font-size:13px;display:inline-flex;align-items:center;gap:7px;border-style:solid}
.cats2 .cat::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cc,var(--accent));flex:none}
.cats2 .cat.sel::before{background:color-mix(in srgb,var(--on-accent) 55%,transparent)}
.cats2 .cat.add::before{display:none}
.cats2 .cat.preset:not(.sel){border-style:solid}
.cat{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--dim);font-size:14px;font-weight:550}
.cat.sel{color:var(--on-accent);background:var(--cc,var(--accent));border-color:transparent;font-weight:650}
.cat.preset:not(.sel){border-style:dashed}
.cat.hiddentab:not(.sel){border-style:dotted}
.cat.add{border-style:dashed;color:var(--dim)}
.cathint{align-self:center;color:var(--dim);font-size:13px;padding:0 4px;white-space:nowrap}
#editBtn.on{background:var(--accent);color:var(--on-accent)}
#editBtn{gap:6px;grid-auto-flow:column}

.namebar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.namebar input{flex:1;min-width:0;background:var(--raised);border:1px solid var(--line);border-radius:10px;color:var(--text);
  font:inherit;font-size:16px;padding:11px 12px;-webkit-user-select:text;user-select:text;box-shadow:var(--shadow)}
.namebar input::placeholder{color:var(--faint)}
.namebar input:focus{outline:none;border-color:var(--accent)}
.recents{display:flex;gap:6px;overflow-x:auto;margin:-2px 0 10px;scrollbar-width:none}
.recents::-webkit-scrollbar{display:none}
.recents:empty{display:none}
.chip{flex:none;border:1px solid var(--line);background:none;color:var(--dim);border-radius:999px;padding:6px 12px;font-size:13px}
.chip:active{background:var(--press)}
.gwrap{flex:1;overflow:auto;min-height:0;margin:0 -2px;padding:0 2px}
.ghead{font-size:13px;color:var(--dim);margin:14px 2px 8px;font-weight:550}
.ghead:first-child{margin-top:2px}

/* Botones de track: etiqueta de consola con el color del track como borde encendido */
.tgrid{margin-bottom:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;grid-auto-rows:minmax(70px,auto)}
.tpad,.pad{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--raised);color:var(--text);
  text-align:left;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);
  transition:transform .08s ease, background-color .2s ease;overflow:hidden}
.tpad{padding:10px 12px 11px 16px;font-weight:620;font-size:16px;line-height:1.2}
.tpad::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc,var(--line2));
  box-shadow:0 0 12px color-mix(in srgb,var(--tc,transparent) 55%,transparent)}
.tpad .k,.pad .k{font-size:11px;color:var(--faint);font-weight:500;font-variant-numeric:tabular-nums}
.tpad .lab{word-break:break-word}
.tpad:active,.pad:active{transform:scale(.97);background:var(--press)}
.tpad.busy,.pad.busy{opacity:.55}
.tpad.flash-ok,.pad.flash-ok{background:color-mix(in srgb,var(--ok) 26%,var(--raised))}
.tpad.flash-err,.pad.flash-err{background:color-mix(in srgb,var(--err) 28%,var(--raised))}
.tpad .hide{position:absolute;top:7px;right:9px;font-size:11px;font-weight:600;color:var(--dim);display:none}
body.editing .tpad .hide,.tpad.offpad .hide{display:block}
body.editing .tpad{border-style:dashed;border-color:var(--line2)}
.tpad.hidden-t{opacity:.45}
.tpad.offpad{opacity:.6;filter:saturate(.3)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;grid-auto-rows:minmax(86px,auto);align-content:start}
.pad{padding:12px 14px 13px 16px;font-weight:620;font-size:17px;line-height:1.2}
.pad::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cc,var(--accent))}
.pad .sub{color:var(--cc,var(--accent));font-size:12px;font-weight:600}
.pad .dest{font-size:11px;color:var(--faint);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.pad .dest.miss{color:var(--err-text)}
body.editing .pad{border-style:dashed;border-color:var(--accent)}
.pad.add{border-style:dashed;color:var(--dim);align-items:center;justify-content:center;font-size:15px;box-shadow:none;background:none}
.pad.add::before{display:none}
.fbar{display:none;gap:8px;margin-bottom:10px;align-items:center;color:var(--dim);font-size:13px;line-height:1.4}
body.editing .fbar,.fbar.always{display:flex}
.fbar span{flex:1}

/* Dock inferior de la botonera: REF, Escena, Deshacer */
.dock{display:flex;gap:8px;padding-top:12px;margin-top:auto;border-top:1px solid var(--line)}
.dock button{flex:1;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--raised);color:var(--text);
  font-size:15px;font-weight:600;box-shadow:var(--shadow)}
.dock button:active{background:var(--press)}
#refBtn{flex:1.3;letter-spacing:.06em;font-weight:750;font-size:16px}
#refBtn.on{background:var(--accent);color:var(--on-accent);border-color:transparent;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}


/* ===== Diálogos ===== */
dialog{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:var(--r-lg);padding:0;
  width:min(520px,92vw);max-height:84vh;box-shadow:0 20px 60px #0006}
dialog::backdrop{background:var(--scrim);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-size:16px}
.dlist{overflow:auto;max-height:62vh;padding:6px 8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:10px}
.row:active{background:var(--press)}
.row .ix{width:28px;color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.row .nm{flex:1}
.chk{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--on-accent)}
.row.on .chk{background:var(--accent);border-color:var(--accent)}
.ef{padding:14px 16px;display:grid;gap:12px}
.ef label{display:grid;gap:6px;font-size:13px;color:var(--dim)}
.ef input,.ef select{background:var(--raised);border:1px solid var(--line);border-radius:10px;color:var(--text);
  font:inherit;font-size:16px;padding:10px 12px;-webkit-user-select:text;user-select:text;width:100%}
.ef input[type=color]{padding:2px;height:42px}
.ebtns,.sbtns{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.ebtns .hbtn,.sbtns .hbtn{flex:1}
#askOk,#ecSave,#edSave{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:650}
.hbtn.danger{color:var(--err-text);border-color:color-mix(in srgb,var(--err) 40%,var(--line))}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches button{width:34px;height:34px;border-radius:8px;border:2px solid transparent}
.swatches button.sel{border-color:var(--text);box-shadow:0 0 0 2px var(--bg) inset}
.swatches button.none{background:var(--raised);color:var(--dim);font-size:12px;width:auto;padding:0 10px;border-color:var(--line)}

/* Ajustes / estado */
.st{padding:12px 16px;display:grid;gap:10px;font-size:14px;overflow:auto;max-height:52vh}
.st .row2{display:flex;justify-content:space-between;gap:12px;align-items:center}
.st .k2{color:var(--dim)}
.st .v2{text-align:right;word-break:break-word}
.st .bad{color:var(--err-text)}
.st .warn{color:var(--accent)}
.hist{font:12px ui-monospace,"SF Mono",Menlo,monospace;color:var(--dim);max-height:24vh;overflow:auto;border-top:1px solid var(--line);padding-top:8px}
.hist div{display:flex;gap:8px;padding:2px 0}
.hist .c{flex:1;color:var(--text)}
.hist .e{color:var(--err-text)}
.themes{padding:14px 16px 4px;display:grid;gap:10px}
.themes .tl{font-size:13px;color:var(--dim)}
.edf{display:grid;gap:5px;font-size:13px;color:var(--dim)}
.edf input,.edf select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--text);font:inherit;font-size:15px;-webkit-user-select:text;user-select:text}
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.tbtn{display:grid;gap:8px;justify-items:start;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--raised);text-align:left;font-size:13px;font-weight:600}
.tbtn.sel{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.tbtn .sw3{display:flex;gap:0;border-radius:6px;overflow:hidden;width:100%;height:22px;border:1px solid #8882}
.tbtn .sw3 i{flex:1}

/* ===== Lista ===== */
#viewList{display:none}
body.list #viewPads{display:none}
body.list #viewList{display:flex}
#viewList section{flex:1}
.ltools{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.lstat{flex:1;color:var(--dim);font-size:13px;min-width:160px}
.lstat.paused{color:var(--accent)}
.clips{overflow:auto;flex:1;margin:0 -6px}
.clip{display:grid;grid-template-columns:118px 1fr auto auto;gap:2px 14px;align-items:center;padding:11px 10px;border-radius:10px;border-bottom:1px solid var(--line)}
.clip:active{background:var(--press)}
.clip .tin{font:600 16px ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
.clip .tout{font:12px ui-monospace,"SF Mono",Menlo,monospace;color:var(--dim)}
.clip .cn{font-size:16px;font-weight:620;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clip .tr{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clip .du{grid-row:span 2;font:12px ui-monospace,Menlo,monospace;color:var(--dim);text-align:right}
.clip .ren{grid-row:span 2;border:1px solid var(--line);background:none;color:var(--dim);border-radius:8px;font-size:13px;padding:6px 9px}
.clip.new{background:color-mix(in srgb,var(--accent) 12%,transparent);box-shadow:inset 3px 0 0 var(--accent)}
.clip.new .cn::after{content:"nuevo";margin-left:8px;font-size:11px;font-weight:700;color:var(--on-accent);background:var(--accent);border-radius:5px;padding:2px 6px;vertical-align:2px}
.clip.here{outline:1.5px solid var(--ok)}

/* ===== Grabar ===== */
#viewRec{display:none;gap:14px}
body.rec #viewPads,body.rec #viewList{display:none}
body.rec #viewRec{display:grid;grid-template-columns:330px 1fr}
.rs{display:grid;gap:14px;overflow:auto;align-content:start}
.rs .lbl2{font-size:13px;color:var(--dim);margin-bottom:6px;font-weight:550}
.rs select,.rs #recText{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;font-size:15px;padding:10px;-webkit-user-select:text;user-select:text}
.swp{display:flex;flex-wrap:wrap;gap:6px}
.swp .chip{display:inline-flex;align-items:center;gap:7px}
.swp .chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tc,var(--line2));flex:none}
.swp .chip.on::before{box-shadow:0 0 0 2px color-mix(in srgb,var(--on-accent) 35%,transparent)}
.swp .chip.on{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.swp .chip .n{opacity:.75;margin-left:5px;font-size:11px;font-variant-numeric:tabular-nums}
.sgh{font-size:12px;color:var(--faint);margin:8px 0 4px}
.tog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text);line-height:1.3}
.tog input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.rmain{display:flex;flex-direction:column;min-height:0;gap:12px}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.prog .bar{flex:1;height:4px;background:var(--raised);border-radius:3px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ok);transition:width .3s ease}
.card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--raised);padding:20px;display:grid;gap:10px;box-shadow:var(--shadow)}
.card .tcs{font:600 22px ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;color:var(--dim)}
.card .tcs small{font-size:14px;color:var(--faint);font-weight:400;margin-left:8px}
.card .src{font-size:13px;color:var(--dim)}
.card .nm{font-size:32px;font-weight:720;line-height:1.1;letter-spacing:-.02em;word-break:break-word;cursor:text}
.card .nm.auto::after,.card .nm.editado::after{font-size:11px;font-weight:650;letter-spacing:0;border-radius:5px;padding:2px 6px;margin-left:10px;vertical-align:8px}
.card .nm.auto::after{content:"auto";color:var(--dim);border:1px solid var(--line2)}
.card .nm.editado::after{content:"editado";color:var(--on-accent);background:var(--accent)}
.card input.nmi{font-size:26px;font-weight:700;background:var(--bg);border:1px solid var(--accent);border-radius:10px;color:var(--text);padding:8px 10px;width:100%;-webkit-user-select:text;user-select:text}
.card .hint{font-size:12px;color:var(--dim)}
.card .cren{background:none;border:0;color:var(--dim);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:0;justify-self:start}
.need{border:1px solid color-mix(in srgb,var(--accent) 60%,var(--line));background:color-mix(in srgb,var(--accent) 7%,transparent);border-radius:14px;padding:12px;display:grid;gap:10px}
.need b{font-size:14px;color:var(--accent)}
.need .opts{display:flex;flex-wrap:wrap;gap:8px}
.need .opts button{flex:1 1 140px;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:620;font-size:16px}
.need .opts button:active{background:var(--press)}

<script>
const PAGE_VERSION = '__SPOTPAD_VERSION__';
const THEMES = [
  {id: 'auto', name: 'Automático', sw: ['#141519', '#eceef1', '#f0b03f']},
  {id: 'estudio', name: 'Estudio', sw: ['#141519', '#23262d', '#f0b03f']},
  {id: 'cabina', name: 'Cabina', sw: ['#0e1615', '#1a2a29', '#5ed6b4']},
  {id: 'noche', name: 'Noche', sw: ['#12131c', '#212433', '#a99bff']},
  {id: 'dia', name: 'Día', sw: ['#eceef1', '#ffffff', '#b8720a']},
];
function themeChoice() { try { return JSON.parse(localStorage.getItem('spotpad.theme')) || 'auto'; } catch { return 'auto'; } }
function applyTheme(id) {
  const light = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches;
  const t = id === 'auto' ? (light ? 'dia' : 'estudio') : id;
  document.documentElement.dataset.theme = t;
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  document.querySelector('meta[name=theme-color]').setAttribute('content', bg || '#141519');
}
function renderThemes() {
  const box = document.getElementById('themeList'); box.innerHTML = '';
  const cur = themeChoice();
  THEMES.forEach(t => {
    const b = document.createElement('button'); b.className = 'tbtn' + (t.id === cur ? ' sel' : '');
    b.innerHTML = '<span class="sw3">' + t.sw.map(c => `<i style="background:${c}"></i>`).join('') + '</span><span></span>';
    b.lastChild.textContent = t.name;
    b.onclick = () => { try { localStorage.setItem('spotpad.theme', JSON.stringify(t.id)); } catch {} applyTheme(t.id); renderThemes(); };
    box.append(b);
  });
}
applyTheme(themeChoice());
if (window.matchMedia) matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', () => applyTheme(themeChoice()));   // la pone el servidor; si SpotPad se actualiza, la página se recarga sola
const $ = s => document.querySelector(s);
let presets = [], presetData = {todas: [], generica: [], botonera: {categorias: [], agregados: {}, ocultas: [], ocultos: {}}, proyecto: ''}, catIdx = 0, tracks = [];

async function api(path, opts = {}) {
  const r = await fetch(path, {headers: {'Content-Type': 'application/json'}, ...opts});
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.ok === false) throw new Error(j.error || `Error ${r.status}`);
  return j;
}

let toastT;
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = err ? 'err' : '', err ? 3500 : 1600);
}
function buzz(ok) { try { navigator.vibrate && navigator.vibrate(ok ? 15 : [40, 40, 40]); } catch {} }

/* ---------- aviso de actualización ---------- */
let updWas = '';
function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } }
function lsSet(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} }
function showUpdate(u, offline) {
  const bar = $('#updBar'), txt = $('#updTxt'), go = $('#updBarGo'), x = $('#updBarX'), prog = $('#updProg');
  const busy = u && (u.state === 'downloading' || u.state === 'installing');
  $('#gearBtn').classList.toggle('upd', !!(u && (u.available || busy)));
  if (offline && updWas === 'installing') {          // la app se está reiniciando
    bar.hidden = false; go.hidden = x.hidden = true; prog.style.width = '100%';
    txt.innerHTML = '<b>Reiniciando SpotPad…</b> vuelve sola en unos segundos'; return;
  }
  if (!u) { bar.hidden = true; return; }
  updWas = u.state;
  if (busy) {
    bar.hidden = false; go.hidden = x.hidden = true;
    const pct = Math.round((u.progress || 0) * 100);
    prog.style.width = (u.state === 'installing' ? 100 : pct) + '%';
    txt.innerHTML = u.state === 'downloading' ? `<b>Bajando SpotPad ${esc2(u.latest)}</b> · ${pct} %` : '<b>Instalando…</b> SpotPad se reinicia sola';
    lsSet('spUpdating', u.latest);
    return;
  }
  if (u.available && lsGet('spUpdLater') !== u.latest) {
    bar.hidden = false; go.hidden = !u.can_install; x.hidden = false; prog.style.width = '0';
    txt.innerHTML = `<b>SpotPad ${esc2(u.latest)}</b> está disponible` + (u.can_install ? '' : ' · bajala de GitHub');
    return;
  }
  bar.hidden = true;
}

/* ---------- estado de conexión ---------- */
async function poll() {
  try {
    const s = await api('/api/status');
    if (s.version && s.version !== PAGE_VERSION && !PAGE_VERSION.startsWith('__')) { location.reload(); return; }
    showUpdate(s.update);
    $('#dot').className = 'dot ' + (s.connected ? 'on' : 'off');
    document.body.classList.toggle('offline', !s.connected);
    // Al conectarse con Pro Tools, traer las carpetas de la sesión
    if (s.connected && !wasConnected) loadLayout(true);
    wasConnected = !!s.connected;
    $('#session').textContent = s.connected ? s.session + (s.mock ? '  ·  MOCK' : '') : s.error;
    if (s.connected && s.session !== sessionName) { const first = !sessionName; sessionName = s.session; seen = null; if (!first) loadLayout(true); }
    // Avisos de Pro Tools (sesión abierta/cerrada, track renombrado)
    if (evSeq === null) evSeq = s.ev_seq || 0;
    else if (s.ev_seq > evSeq && s.ev_last) {
      evSeq = s.ev_seq; const ev = s.ev_last;
      if (ev.id === 'SpotPad_IA') toast(ev.data.msg || 'IA');
      else toast('Pro Tools: ' + ev.label + (ev.data && (ev.data.session_name || ev.data.new_name) ? ' · ' + (ev.data.session_name || ev.data.new_name) : ''));
      loadLayout(true);
      if (document.body.classList.contains('rec')) setTimeout(recEnter, 3000);
    }
    evStatus = s.ev_status || '';
  } catch { showUpdate(null, true); $('#dot').className = 'dot off'; $('#session').textContent = 'sin conexión con la computadora'; document.body.classList.remove('offline'); }
}

function fillTrackSelect(sel, current, emptyLabel) {
  sel.innerHTML = '';
  const o0 = document.createElement('option'); o0.value = ''; o0.textContent = emptyLabel; sel.append(o0);
  if (current && !hasTrack(current)) {
    const o = document.createElement('option'); o.value = current; o.textContent = current + ' (no está en esta sesión)'; sel.append(o);
  }
  layout.tabs.forEach(t => {
    const og = document.createElement('optgroup'); og.label = t.name;
    t.groups.forEach(g => g.tracks.forEach(tr => {
      const o = document.createElement('option'); o.value = tr.name; o.textContent = (g.name ? g.name + ' › ' : '') + tr.name; og.append(o);
    }));
    sel.append(og);
  });
  sel.value = current || '';
  if (sel.value !== (current || '')) {   // nombre con otra mayúscula/espacios
    const m = [...sel.options].find(o => o.value.trim().toLowerCase() === (current || '').trim().toLowerCase());
    if (m) sel.value = m.value;
  }
}
// Botonera = genérica + lo del proyecto. Editando, se elige cuál se toca (la genérica no cambia desde el proyecto).
const editScope = () => (presetData.proyecto && ls.get('spotpad.editScope', 'generica') === 'proyecto') ? 'proyecto' : 'generica';
function syncPresets() {
  if (editing && editScope() === 'generica') presets = presetData.generica;     // los objetos crudos: el editor de siempre
  else if (editing) presets = presetData.todas;
  else presets = presetData.todas.filter(c => !c.oculta).map(c => ({...c, items: c.items.filter(i => !i.oculto)}));
}
function applyPresets(r) { presetData = {...presetData, ...r}; syncPresets(); }
async function loadPresets() { try { applyPresets(await api('/api/presets')); } catch {} }
async function savePresets(msg) {
  try {
    const r = editScope() === 'proyecto'
      ? await api('/api/project/botonera', {method: 'PUT', body: JSON.stringify(presetData.botonera)})
      : await api('/api/presets', {method: 'PUT', body: JSON.stringify({categories: presets})});
    applyPresets(r); toast(msg || 'Guardado'); buzz(true);
  } catch (e) { toast(e.message, true); await loadPresets(); }
  renderCats(); renderGrid();
}
// Lista del proyecto donde va un botón de esta categoría (agregados a una genérica, o la categoría propia)
function projList(cat) {
  const b = presetData.botonera;
  if (cat.scope === 'proyecto') return (b.categorias.find(c => c.id === cat.id) || {items: []}).items;
  return (b.agregados[cat.id] = b.agregados[cat.id] || []);
}

// Borrar pide un segundo toque (sin diálogos del sistema)
function confirmTap(btn) {
  if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = btn.dataset.txt; return true; }
  btn.dataset.txt = btn.textContent; btn.dataset.armed = 1; btn.textContent = '¿Seguro? Tocá de nuevo';
  setTimeout(() => { if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = btn.dataset.txt; } }, 3000);
  return false;
}

  $('#ecColor').value = (cat && /^#[0-9a-f]{6}$/i.test(cat.color)) ? cat.color : '#E8A33D';

$('#ecSave').onclick = () => {

  const proj = editScope() === 'proyecto';
  if (proj && cat) cat = presetData.botonera.categorias.find(c => c.id === cat.id);
  if (!cat) {
    const base = (proj ? 'p-' : '') + (label.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'cat');
    const used = id => presetData.todas.some(p => p.id === id) || presetData.generica.some(p => p.id === id);
    let id = base, k = 2; while (used(id)) id = base + '-' + k++;
    cat = {id, label, color: $('#ecColor').value, items: []};
    (proj ? presetData.botonera.categorias : presets).push(cat);
    tabKey = 'p:' + id; ls.set(tabStore(), tabKey);
  }
  cat.label = label; cat.color = $('#ecColor').value;
  const t = $('#ecTrack').value.trim(); if (t) cat.track = t; else delete cat.track;
  $('#edCat').close(); savePresets('Categoría guardada');

  if (editScope() === 'proyecto') presetData.botonera.categorias = presetData.botonera.categorias.filter(c => c.id !== edCtx.cat.id);

};

const esc3 = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const iniciales = n => String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
const caraUrl = p => `/api/cara/${encodeURIComponent(p.id)}?v=${p.cara_v || 0}`;
function faceEl(p) {
  if (p && p.cara) { const i = document.createElement('img'); i.className = 'face'; i.alt = ''; i.src = caraUrl(p); return i; }
  const s = document.createElement('span'); s.className = 'face'; s.textContent = iniciales(p && p.nombre); return s;
}
function trackFaces() {
  const out = {};
  ((layout.personajes || {}).personajes || []).forEach(p => { if (p.track && p.cara) out[p.track] = p; });

function ftsPicker() {
  const P = layout.personajes;
  if (!P) return null;
  const prin = P.personajes.filter(p => p.track || p.id);
  const extra = ls.get('spotpad.ftsExtra', []);
  const sec = [...P.secundarios, ...extra.filter(n => !P.secundarios.includes(n) && !prin.some(p => low(p.nombre) === low(n)))];
  if (!prin.length && !sec.length && !P.calzados.length) return null;
  let sel = ls.get('spotpad.ftsChar', '');
  const box = document.createElement('div'); box.className = 'fpick';
  box.innerHTML = '<div class="lbl2">Personaje</div><div class="frow" data-r="c"></div><div class="lbl2" data-l="s"></div><div class="frow" data-r="s"></div>';
  const rc = box.querySelector('[data-r=c]'), rs = box.querySelector('[data-r=s]');
  const draw = () => {
    rc.innerHTML = ''; rs.innerHTML = '';
    const pick = n => { sel = low(sel) === low(n) ? '' : n; ls.set('spotpad.ftsChar', sel); draw(); buzz(true); };
    prin.forEach(p => {
      const b = document.createElement('button'); b.className = 'fchar' + (low(sel) === low(p.nombre) ? ' sel' : '');
      b.append(faceEl(p), document.createTextNode(p.nombre)); b.onclick = () => pick(p.nombre); rc.append(b);
    });
    sec.forEach(n => {
      const b = document.createElement('button'); b.className = 'fchar plain' + (low(sel) === low(n) ? ' sel' : '');
      b.textContent = n; b.onclick = () => pick(n); rc.append(b);
    });
    const o = document.createElement('button'); o.className = 'fchar plain'; o.textContent = '+ Otro';
    o.onclick = async () => {
      const r = await ask({title: 'Personaje', label: 'Nombre (va como nombre del clip)', hint: 'Secundarios y extras: «Sonia», «Extra Left».'});
      if (!r || !r.name.trim()) return;
      const n = r.name.trim(); ls.set('spotpad.ftsExtra', [n, ...extra.filter(x => low(x) !== low(n))].slice(0, 20));
      if (!sec.some(x => low(x) === low(n))) sec.unshift(n);
      sel = n; ls.set('spotpad.ftsChar', n); draw();
    };
    rc.append(o);
    const p = prin.find(x => low(x.nombre) === low(sel));
    box.querySelector('[data-l=s]').textContent = sel ? `Calzado de ${sel} → se marca` : 'Calzado (elegí primero el personaje)';
    let shoes = P.calzados.map(c => c.label);
    if (p && p.track && p.calzado && !shoes.some(x => low(x) === low(p.calzado))) shoes.unshift(p.calzado);
    if (p && p.track && p.calzado) shoes = [p.calzado, ...shoes.filter(x => low(x) !== low(p.calzado))];
    shoes.forEach(label => {
      const own = p && p.track && p.calzado && low(label) === low(p.calzado);
      const b = document.createElement('button'); b.className = 'fshoe' + (own ? ' own' : ''); b.disabled = !sel;
      b.innerHTML = esc3(label) + (own ? '<small>el de siempre</small>' : (p && p.track ? '<small>en su track</small>' : ''));
      b.onclick = async () => {
        if (b.classList.contains('busy')) return;
        b.classList.add('busy');
        try { const r = await api('/api/fts/group', {method: 'POST', body: JSON.stringify({personaje: sel, calzado: own ? '' : label, ref: useRef()})});
              flash(b, true); toast(r.msg); }
        catch (e) { flash(b, false); toast(e.message, true); }
        b.classList.remove('busy');
      };
      rs.append(b);
    });
    if (!shoes.length) rs.innerHTML = '<span class="cathint">No hay tracks de calzado en la carpeta de pasos</span>';
  };
  draw();
  return box;
}

// Fotos: se achican en el iPad/compu antes de subir (no viaja la foto original de 12 MB)
async function achicar(file, max = 640) {
  let img;
  try { img = await createImageBitmap(file); }
  catch {
    img = await new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => err(new Error('No pude abrir la foto'));
                                           i.src = URL.createObjectURL(file); });
  }
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.85));
}
async function subirCara(pid, file) {
  if (!file || !/^image\//.test(file.type || 'image/')) throw new Error('Eso no es una foto');
  const blob = await achicar(file);
  const r = await fetch('/api/personajes/' + encodeURIComponent(pid) + '/cara', {method: 'PUT', headers: {'Content-Type': 'image/jpeg'}, body: blob});
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.ok === false) throw new Error(j.error || `Error ${r.status}`);
  return j.personaje;
}
function droppable(el, onFile) {     // arrastrar una foto desde la compu
  el.addEventListener('dragover', e => { if ([...(e.dataTransfer.types || [])].includes('Files')) { e.preventDefault(); el.classList.add('drop'); } });
  el.addEventListener('dragleave', () => el.classList.remove('drop'));
  el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('drop'); const f = e.dataTransfer.files[0]; if (f) onFile(f); });
}

/* ---------- modo grabación ---------- */
let rec = {items: [], sweepable: [], shoes: [], surfaces: [], fts: []}, recSt = {}, recCur = null, recTracks = [];
const esc2 = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const pending = it => !it.muted && !it.done;
function recVisible() { return rec.items.filter(it => $('#recShowDone').checked || pending(it) || (recCur && it.key === recCur)); }

let recSig = '';
async function recPoll() {           // sigue lo que se hace con los atajos desde la computadora
  if (document.visibilityState !== 'visible' || !document.body.classList.contains('rec')) return;
  if (document.querySelector('#recName + input, input.nmi') || document.querySelector('dialog[open]')) return;
  const r = await api('/api/rec/queue').catch(() => null);
  if (!r || r.need_refresh) return;
  const sig = r.cur + '|' + r.items.map(i => i.key + (i.done ? 'd' : '') + i.name).join(',');
  if (sig !== recSig) { recSig = sig; if (r.cur) recCur = r.cur; recApply(r); }
}
setInterval(recPoll, 2000);
async function recEnter() {
  api('/api/hotkeys').then(h => {
    $('#recKeys').innerHTML = h.enabled && h.keys.length ? '<b style="color:var(--text)">Atajos en la computadora</b><br>' +
      h.keys.map(k => `<span class="mono" style="color:var(--text)">${esc2(k.label)}</span> ${esc2(k.desc)}`).join('<br>') : '';
  }).catch(() => {});
  recSt = await api('/api/rec/state').catch(() => ({}));
  $('#recAuto').checked = recSt.auto_rename !== false;
  $('#recFollow').checked = !!recSt.follow;
  $('#recView').checked = !!recSt.move_view;
  recTracks = await api('/api/tracks').catch(() => []);
  const r = await api('/api/rec/queue').catch(() => null);
  if (r && !r.need_refresh) recApply(r); else await recRefresh();
  recRenderSetup();
}
async function recRefresh() {
  $('#recAt').textContent = 'Leyendo la sesión…';
  try {
    const r = await api('/api/rec/refresh', {method: 'POST'});
    if (r.paused) { toast('Pro Tools está grabando o reproduciendo: leo cuando pares', true); }
    recApply(r); recRenderSetup();
  } catch (e) { $('#recAt').textContent = ''; toast(e.message, true); }
}
function recApply(r) {
  if (!r || !r.items) return;
  rec = {...rec, ...r};
  $('#recAt').textContent = r.at ? `Sesión ${r.session} · leída ${r.at}` : '';
  if (r.cur && rec.items.some(i => i.key === r.cur)) recCur = r.cur;      // lo que se movió con los atajos
  const vis = recVisible();
  if (!recCur || !rec.items.some(i => i.key === recCur)) recCur = (vis.find(pending) || vis[0] || {}).key || null;
  recRender();
}
function recRenderSetup() {
  // Qué barrer: chips por tipo de carpeta, con pendientes por track
  const box = $('#recSweep'); box.innerHTML = '';
  const sweep = new Set(recSt.sweep || []);
  const counts = {}; rec.items.forEach(i => { if (pending(i)) counts[i.track] = (counts[i.track] || 0) + 1; });
  const groups = [['footsteps', 'Pasos'], ['props', 'Props'], ['surfaces', 'Superficies']];
  if (!rec.sweepable.length) box.innerHTML = '<div class="hint" style="color:var(--dim);font-size:13px">Tocá «Leer sesión». Se usan las carpetas de superficies, pasos y props.</div>';
  groups.forEach(([k, label]) => {
    const tr = rec.sweepable.filter(t => t.kind === k); if (!tr.length) return;
    const h = document.createElement('div'); h.className = 'sgh'; h.textContent = label; box.append(h);
    const wrap = document.createElement('div'); wrap.className = 'swp'; box.append(wrap);
    tr.forEach(t => {
      const b = document.createElement('button'); b.className = 'chip' + (sweep.has(t.name) ? ' on' : '');
      const col = tcolor(t.color); if (col) b.style.setProperty('--tc', col);
      b.innerHTML = `${esc2(t.name)}${sweep.has(t.name) && counts[t.name] ? `<span class="n">${counts[t.name]}</span>` : ''}`;
      b.onclick = async () => {
        sweep.has(t.name) ? sweep.delete(t.name) : sweep.add(t.name);
        recSt.sweep = [...sweep]; await recPutState({sweep: recSt.sweep}); recRenderSetup();
      };
      wrap.append(b);
    });
  });
  // Superficie
  const ss = $('#recSurf'); ss.innerHTML = '<option value="">Todas</option>' +
    (rec.surface_tracks || []).map(n => `<option>${esc2(n)}</option>`).join('');
  ss.value = recSt.surface_filter || '';
  if (document.activeElement !== $('#recText')) $('#recText').value = recSt.text_filter || '';
  // Track de grabación (cualquier track de la sesión)
  const rt = $('#recTrack');
  rt.innerHTML = '<option value="">(ninguno: solo posicionar)</option>' +
    recTracks.map(t => `<option value="${esc2(t.id)}">${esc2(t.name)}</option>`).join('');
  rt.value = recSt.rec_track || '';
}
async function recPutState(patch) {
  try { const r = await api('/api/rec/state', {method: 'PUT', body: JSON.stringify(patch)}); recApply(r); }
  catch (e) { toast(e.message, true); }
}

function recItem() { return rec.items.find(i => i.key === recCur); }
function recRender() {
  const all = rec.items, pend = all.filter(pending).length, total = all.length;
  $('#recProg').textContent = total ? `Pendientes ${pend} de ${total}` : 'Nada para barrer';
  $('#recBar').style.width = total ? ((total - pend) / total * 100) + '%' : '0';
  const it = recItem(), card = $('#recCard');
  if (!it) {
    card.innerHTML = `<div class="card"><div class="rempty">${(recSt.sweep || []).length ? (total ? '¡No quedan pendientes en lo que elegiste!' : 'No hay clips en esos tracks.') : 'Elegí qué tracks barrer (por ejemplo un calzado y una superficie, o un track de props).'}</div></div>`;
  } else {
    const src = it.kind === 'footsteps' && it.shoe ? ({color: 'calzado por color del track', clip: 'calzado por el nombre del clip', personaje: 'calzado fijado para el personaje', elegido: 'calzado elegido', track: ''}[it.shoe_src] || '') : '';
    card.innerHTML = `<div class="card">
      <div class="tcs">${esc2(it.tc_in || it.start)}<small>→ ${esc2(it.tc_out || it.end)}</small></div>
      <div class="src">${esc2(it.track)} · clip «${esc2(it.clip)}»${it.ref ? ' · <b>REF</b>' : ''}${it.muted ? ' · muteado' : ''}${it.done ? ' · grabado' : ''}</div>
      <button class="cren" id="recRenClip">Renombrar el clip de spotting</button>
      <div class="nm ${it.name_src}" id="recName" title="Tocá para editar">${esc2(it.name)}</div>
      <div class="hint">${src ? esc2(src) + ' · ' : ''}tocá el nombre para editarlo</div>
      <div id="recNeeds"></div></div>`;
    $('#recName').onclick = () => recEditName(it);
    $('#recRenClip').onclick = () => renameClip({track: it.track, clip: it.clip, start: it.start, end: it.end, tc_in: it.tc_in},
                                                () => setTimeout(async () => recApply(await api('/api/rec/queue')), 300));
    const needs = $('#recNeeds');
    if (it.needs.includes('surface')) needs.append(recNeed('Choque de superficies: ¿sobre cuál camina?', it.surfaces, v => recChoose({key: it.key, surface: v})));
    if (it.needs.includes('shoe')) {
      const n = recNeed(`¿Qué calzado usa ${esc2(it.character || 'este personaje')}?`, rec.shoes, v =>
        $('#recRemember').checked && it.character ? recChoose({character: it.character, char_shoe: v}) : recChoose({key: it.key, shoe: v}));
      const lab = document.createElement('label'); lab.className = 'tog';
      lab.innerHTML = `<input type="checkbox" id="recRemember" checked> Recordarlo para ${esc2(it.character || 'el personaje')} (todos sus pasos)`;
      n.append(lab); needs.append(n);
    }
  }
  $('#recDone').classList.toggle('on', !!(it && it.done));
  $('#recDone').textContent = it && it.done ? 'Volver a pendiente' : 'Grabado';
  // Cola
  const q = $('#recQueue'); q.innerHTML = '';
  recVisible().forEach(x => {
    const d = document.createElement('div');
    d.className = 'qi' + (x.key === recCur ? ' cur' : '') + (pending(x) ? '' : ' gone') + (x.extra ? ' extra' : '');
    d.innerHTML = `<span class="t">${esc2(x.tc_in || x.start)}</span><span class="q">${esc2(x.name)}</span><span class="w">${x.needs.length ? '⚠ elegir' : ''}</span>`;
    d.onclick = () => recSelect(x.key, true);
    q.append(d);
  });
  const cur = q.querySelector('.cur'); if (cur) cur.scrollIntoView({block: 'nearest'});
}
function recNeed(title, options, pick) {
  const n = document.createElement('div'); n.className = 'need';
  n.innerHTML = `<b>${title}</b><div class="opts"></div>`;
  options.forEach(o => { const b = document.createElement('button'); b.textContent = o; b.onclick = () => pick(o); n.querySelector('.opts').append(b); });
  return n;
}
async function recChoose(body) {
  try { const r = await api('/api/rec/choice', {method: 'POST', body: JSON.stringify(body)}); recApply(r); buzz(true);
        const it = recItem(); if (it && !it.needs.length) recGo(it); }
  catch (e) { toast(e.message, true); }
}
function recEditName(it) {
  const el = $('#recName'); const inp = document.createElement('input'); inp.className = 'nmi'; inp.value = it.name;
  el.replaceWith(inp); inp.focus(); inp.select();
  const finish = async save => {
    if (save && inp.value.trim() !== it.name) {
      const r = await api('/api/rec/choice', {method: 'POST', body: JSON.stringify({key: it.key, name: inp.value.trim()})}).catch(e => toast(e.message, true));
      if (r) { recApply(r); recGo(recItem()); }
    } else recRender();
  };
  inp.onkeydown = e => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); };
  inp.onblur = () => finish(true);
}
async function recGo(it) {
  if (!it) return;
  const rename = $('#recAuto').checked && !it.needs.length;
  try { const r = await api('/api/rec/go', {method: 'POST', body: JSON.stringify({key: it.key, start: it.start, end: it.end, name: it.name, rename})});
        toast(it.needs.length ? 'Posicionado · elegí lo que falta para renombrar' : r.msg); buzz(true); }
  catch (e) { toast(e.message, true); }
}
function recSelect(key, go) { recCur = key; recRender(); if (go) recGo(recItem()); }
function recStep(dir) {
  // Recorre en orden de tiempo desde el actual (aunque el actual ya esté grabado)
  const all = rec.items, ok = x => pending(x) || $('#recShowDone').checked;
  if (!all.length) return;
  const i = all.findIndex(x => x.key === recCur);
  let j = i < 0 ? (dir > 0 ? 0 : all.length - 1) : i + dir;
  while (j >= 0 && j < all.length && !ok(all[j])) j += dir;
  if (j < 0 || j >= all.length) return toast(dir > 0 ? 'No hay más pendientes adelante' : 'No hay pendientes antes');
  recSelect(all[j].key, true);
}
$('#recPrev').onclick = () => recStep(-1);
$('#recNext').onclick = () => recStep(1);
$('#recGo').onclick = () => recGo(recItem());
$('#recSel').onclick = async () => {
  const b = $('#recSel'); b.disabled = true;
  try { const r = await api('/api/rec/from-selection', {method: 'POST'}); if (r.cur) recCur = r.cur;
        toast(r.msg || 'Listo'); buzz(true); recSig = ''; await recPoll(); }
  catch (e) { toast(e.message, true); }
  b.disabled = false;
};
$('#recDone').onclick = async () => {
  const it = recItem(); if (!it) return;
  try { const r = await api('/api/rec/done', {method: 'POST', body: JSON.stringify({key: it.key, done: !it.done})});
        const was = it.done; recApply(r); buzz(true); if (!was) recStep(1); }
  catch (e) { toast(e.message, true); }
};

// Reglas de pasos: cómo se interpretó cada track de la carpeta de pasos + alias de superficies
$('#recRulesBtn').onclick = async () => {
  if (!rec.fts || !rec.fts.length) await recRefresh();
  const b = $('#rrBody');
  const shoeOpts = sel => '<option value="">(automático)</option>' + rec.shoes.map(s => `<option ${s === sel ? 'selected' : ''}>${esc2(s)}</option>`).join('');
  b.innerHTML = `<div class="hint" style="padding:8px 4px;color:var(--dim);font-size:13px">Tracks de personaje: el calzado sale del nombre del clip si lo trae; si no, del que fijes acá; si no, del color del track (igual al del track de calzado).</div>
    <table><tbody>${rec.fts.filter(t => t.type === 'char').map(t => `<tr>
      <td><span class="sw" style="background:${tcolor(t.color) || 'transparent'}"></span>${esc2(t.name)}</td>
      <td style="color:var(--dim);font-size:12px">${t.shoe_track ? 'por nombre: ' + esc2(t.shoe_track) : t.shoe_color ? 'por color: ' + esc2(t.shoe_color) : 'sin deducir'}</td>
      <td style="width:150px"><select data-char="${esc2(t.character)}">${shoeOpts(t.shoe_fixed)}</select></td></tr>`).join('')}</tbody></table>
    <div class="hint" style="padding:12px 4px 4px;color:var(--dim);font-size:13px">Tracks de calzado (el personaje sale del nombre del clip): ${rec.fts.filter(t => t.type === 'shoe').map(t => esc2(t.name)).join(', ') || '—'}</div>
    <div class="hint" style="padding:12px 4px 4px;color:var(--dim);font-size:13px">Nombre corto de cada superficie en el nombre de grabación (vacío = el nombre del track):</div>
    <table><tbody>${(rec.surface_tracks || []).map(n => `<tr><td>${esc2(n)}</td><td style="width:180px"><input data-surf="${esc2(n)}" value="${esc2((rec.surface_alias || {})[n] || '')}" placeholder="${esc2(n)}"></td></tr>`).join('')}</tbody></table>`;
  b.querySelectorAll('select[data-char]').forEach(sel => sel.onchange = () => recChoose({character: sel.dataset.char, char_shoe: sel.value}));
  b.querySelectorAll('input[data-surf]').forEach(inp => inp.onchange = async () => {
    const alias = {...(rec.surface_alias || {})}; if (inp.value.trim()) alias[inp.dataset.surf] = inp.value.trim(); else delete alias[inp.dataset.surf];
    const r = await api('/api/rec/rules', {method: 'PUT', body: JSON.stringify({surface_alias: alias})}).catch(e => toast(e.message, true));
    if (r && r.items) recApply(r);
  });
  $('#recRules').showModal();
};
$('#rrClose').onclick = () => { $('#recRules').close(); recRender(); };

(async () => {
  poll(); setInterval(poll, 4000);
  renderRecents(); await loadHidden(); await loadLayout(true);
  if (['rec', 'folders', 'caras'].includes(ls.get('spotpad.view', 'pads'))) setView(ls.get('spotpad.view'));
})();
</script>
</body>
