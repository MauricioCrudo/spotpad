name: Compilar SpotPad

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Si llega un push nuevo mientras compila, se cancela el anterior: dos publicaciones a la vez
# se pisaban al borrar y crear «Última versión».
concurrency:
  group: compilar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15           # Apple Silicon (M1, M2…)
            name: SpotPad-Mac-AppleSilicon
          - os: macos-15-intel     # Intel
            name: SpotPad-Mac-Intel
          - os: windows-latest
            name: SpotPad-Windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: spotpad
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-app.txt pyinstaller
      - name: Tests
        run: |
          python test_edl.py
          python test_tc.py
          python test_layout.py
          python test_timeout.py
          python test_presets.py
          python test_naming.py
          python test_rec.py
          python test_active.py
          python test_ai.py
          python test_project.py
          python test_personajes.py
          python test_updater.py
          python test_edicion.py
          python test_emparejar.py
          python test_groupon.py
      - name: Compilar
        run: pyinstaller --noconfirm spotpad.spec
      # Firma con el certificado propio (secretos de .github/crear_firma.sh): así macOS reconoce cada versión
      # como la misma app y no vuelve a pedir el permiso de Accesibilidad. Sin secretos, o si algo falla,
      # queda la firma ad hoc de siempre: nunca frena una release.
      - name: Firmar (Mac)
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASS: ${{ secrets.MAC_CERT_PASS }}
        run: |
          if [ -z "$MAC_CERT_P12" ]; then echo "Sin certificado: queda la firma ad hoc"; exit 0; fi
          set +e
          KC="$RUNNER_TEMP/firma.keychain-db"; KPW=$(openssl rand -hex 12)
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/firma.p12"
          security create-keychain -p "$KPW" "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p "$KPW" "$KC"
          security import "$RUNNER_TEMP/firma.p12" -k "$KC" -P "$MAC_CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # Confiar en el certificado solo en esta máquina de compilación (codesign no firma con uno no confiable)
          security find-certificate -c "SpotPad Firma" -p "$KC" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          if codesign --force --deep --sign "SpotPad Firma" --keychain "$KC" dist/SpotPad.app && codesign --verify --deep dist/SpotPad.app; then
            codesign -d -r- dist/SpotPad.app
          else
            echo "::warning::No se pudo firmar con el certificado propio: queda la firma ad hoc"
            codesign --force --deep --sign - dist/SpotPad.app
          fi
          rm -f "$RUNNER_TEMP/firma.p12"
          exit 0
      - name: Prueba de arranque (Mac)
        if: runner.os == 'macOS'
        run: SPOTPAD_DATA="$RUNNER_TEMP/sp" dist/SpotPad.app/Contents/MacOS/SpotPad --selftest
      - name: Prueba de arranque (Windows)
        if: runner.os == 'Windows'
        run: SPOTPAD_DATA="$RUNNER_TEMP/sp" ./dist/SpotPad.exe --selftest
      - name: Empaquetar (Mac)
        if: runner.os == 'macOS'
        run: |
          # zip: lo usa el actualizador de SpotPad · dmg: para instalar a mano (arrastrar a Aplicaciones)
          ditto -c -k --keepParent dist/SpotPad.app "${{ matrix.name }}.zip"
          bash ../.github/make_dmg.sh dist/SpotPad.app "SpotPad" "${{ matrix.name }}.dmg"
      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/SpotPad.exe -DestinationPath "${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            spotpad/${{ matrix.name }}.zip
            spotpad/${{ matrix.name }}.dmg
          if-no-files-found: ignore

  # Modelo del analizador (SigLIP → ONNX). Se baja de Hugging Face y se exporta una sola vez;
  # queda en caché mientras no cambien las descripciones de superficies ni el exportador.
  modelo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analizador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: cache
        uses: actions/cache@v4
        with:
          path: analizador/modelo
          key: modelo-${{ hashFiles('analizador/surfaces.json', 'analizador/export_model.py') }}
      - name: Exportar SigLIP a ONNX
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-modelo.txt
          python export_model.py 2>&1 | tee export.log || {
            tail -n 25 export.log | sed 's/^/::error::/'; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: modelo
          path: analizador/modelo
          retention-days: 3

  analizador:
    needs: modelo
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: SpotPad-Analizador-Mac-AppleSilicon
          - os: macos-15-intel
            name: SpotPad-Analizador-Mac-Intel
          - os: windows-latest
            name: SpotPad-Analizador-Windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: analizador
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: modelo
          path: analizador/modelo
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt onnx pyinstaller
      - name: Tests
        run: python test_analizador.py
      - name: Compilar
        run: pyinstaller --noconfirm analizador.spec
      - name: Prueba de arranque (Mac)
        if: runner.os == 'macOS'
        run: "\"dist/SpotPad Analizador.app/Contents/MacOS/SpotPad Analizador\" --selftest"
      - name: Prueba de arranque (Windows)
        if: runner.os == 'Windows'
        run: "\"./dist/SpotPad Analizador/SpotPad Analizador.exe\" --selftest"
      - name: Empaquetar (Mac)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --keepParent "dist/SpotPad Analizador.app" "${{ matrix.name }}.zip"
          bash ../.github/make_dmg.sh "dist/SpotPad Analizador.app" "SpotPad Analizador" "${{ matrix.name }}.dmg"
      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/SpotPad Analizador" -DestinationPath "${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            analizador/${{ matrix.name }}.zip
            analizador/${{ matrix.name }}.dmg
          if-no-files-found: ignore

  publicar:
    needs: [build, analizador]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: spotpad/bridge.py
          sparse-checkout-cone-mode: false
          path: src
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: SpotPad-*
          merge-multiple: true
      - name: Publicar en «Última versión»
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls out
          VER=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' src/spotpad/bridge.py)
          echo "Versión $VER"
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima out/*.zip out/*.dmg --latest --target "${{ github.sha }}" \
            --title "Última versión · SpotPad $VER" \
            --notes "SpotPad $VER · compilado automáticamente desde ${GITHUB_SHA::7}. Mac: bajá el .dmg de tu procesador y arrastrá SpotPad a Aplicaciones. Windows: el zip. Si ya lo tenés instalado, actualizá desde SpotPad (ícono → Actualizar); los .zip de Mac son para eso."
          # gh sube los zips a un borrador y después lo publica; si ese último paso falla, la
          # versión queda invisible. Publicarla de nuevo y verificar.
          for i in 1 2 3; do
            gh release edit ultima --draft=false --prerelease=false --latest && break
            sleep 5
          done
          test "$(gh release view ultima --json isDraft -q .isDraft)" = "false"
