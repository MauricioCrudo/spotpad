name: Compilar SpotPad

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15           # Apple Silicon (M1, M2…)
            name: SpotPad-Mac-AppleSilicon
          - os: macos-15-intel     # Intel
            name: SpotPad-Mac-Intel
          - os: windows-latest
            name: SpotPad-Windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: spotpad
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-app.txt pyinstaller
      - name: Tests
        run: |
          python test_edl.py
          python test_tc.py
          python test_layout.py
          python test_timeout.py
          python test_presets.py
          python test_naming.py
      - name: Compilar
        run: pyinstaller --noconfirm spotpad.spec
      - name: Prueba de arranque (Mac)
        if: runner.os == 'macOS'
        run: SPOTPAD_DATA="$RUNNER_TEMP/sp" dist/SpotPad.app/Contents/MacOS/SpotPad --selftest
      - name: Prueba de arranque (Windows)
        if: runner.os == 'Windows'
        run: SPOTPAD_DATA="$RUNNER_TEMP/sp" ./dist/SpotPad.exe --selftest
      - name: Empaquetar (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/SpotPad.app "${{ matrix.name }}.zip"
      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/SpotPad.exe -DestinationPath "${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: spotpad/${{ matrix.name }}.zip

  publicar:
    needs: build
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publicar en «Última versión»
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls out
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima out/*.zip --prerelease --target "${{ github.sha }}" \
            --title "Última versión" \
            --notes "Compilado automáticamente desde ${GITHUB_SHA::7}. Bajá el zip de tu computadora."
